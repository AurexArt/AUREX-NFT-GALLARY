<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREX | Relics & Totems</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --neon-pink: #ff00ff;
      --neon-cyan: #00ffff;
      --neon-purple: #9d00ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a001f;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(157, 0, 255, 0.2) 0%, transparent 60%);
    }

    header {
      text-align: center;
      padding: 80px 20px 40px;
      position: relative;
    }

    header h1 {
      font-size: 6.5rem;
      font-weight: 700;
      letter-spacing: 15px;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px var(--neon-pink);
    }

    .subtitle {
      font-size: 1.8rem;
      color: var(--neon-cyan);
      letter-spacing: 6px;
      margin-top: 10px;
    }

    .login-btn {
      position: absolute;
      top: 40px;
      right: 40px;
      padding: 14px 32px;
      background: transparent;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 30px;
      background: rgba(10, 0, 31, 0.9);
    }

    .nav-btn {
      padding: 16px 45px;
      font-size: 1.3rem;
      background: transparent;
      color: white;
      border: 2px solid var(--neon-pink);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s;
    }

    .nav-btn.active,
    .nav-btn:hover {
      background: var(--neon-pink);
      color: black;
      box-shadow: 0 0 30px var(--neon-pink);
    }

    .legendary-banner {
      text-align: center;
      padding: 25px;
      margin: 40px auto;
      max-width: 1100px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #39ff14;
      border-radius: 20px;
      font-size: 2.1rem;
      color: #39ff14;
      font-weight: bold;
    }

    .section { display: none; }
    .section.active { display: block; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 35px;
      padding: 40px 6%;
      max-width: 1900px;
      margin: 0 auto;
    }

    .nft-card {
      background: rgba(30, 0, 60, 0.6);
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(157, 0, 255, 0.4);
      transition: all 0.5s;
    }

    .nft-card:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-15px);
      box-shadow: 0 0 40px var(--neon-cyan);
    }

    .nft-card img {
      width: 100%;
      height: 360px;
      object-fit: cover;
    }

    .info {
      padding: 20px;
      text-align: center;
    }

    .info h3 {
      color: var(--neon-pink);
      margin-bottom: 8px;
    }

    #upload-section {
      text-align: center;
      padding: 30px;
      margin: 30px 6%;
      background: rgba(20,0,50,0.6);
      border: 2px dashed var(--neon-purple);
      border-radius: 20px;
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10,0,31,0.98);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      max-width: 750px;
      width: 90%;
      background: #1a003d;
      border-radius: 25px;
      overflow: hidden;
      border: 3px solid var(--neon-cyan);
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 45px;
      color: var(--neon-pink);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <p class="subtitle">RELICS & TOTEMS</p>
    <button class="login-btn" id="loginBtn">LOGIN</button>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-section="relics">RELICS</button>
    <button class="nav-btn" data-section="totems">TOTEMS</button>
  </nav>

  <!-- Relics Section -->
  <div id="relics-section" class="section active">
    <div class="legendary-banner">
      ALL RELICS ARE LEGENDARY
    </div>
    <div class="gallery" id="relics-gallery"></div>
  </div>

  <!-- Totems Section -->
  <div id="totems-section" class="section">
    <div class="nav" style="margin:30px 0;">
      <button class="nav-btn active" data-type="best">BEST</button>
      <button class="nav-btn" data-type="legendary">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </div>

  <!-- Upload Section -->
  <div id="upload-section">
    <h2>Upload New NFT</h2>
    <input type="file" id="imageUpload" accept="image/*"><br><br>
    <select id="nftType">
      <option value="relics">Relics</option>
      <option value="totems-best">Totems - Best</option>
      <option value="totems-legendary">Totems - Legendary</option>
    </select><br><br>
    <button onclick="uploadImage()">Upload Image</button>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <img id="modalImage" src="" alt="" style="width:100%;">
      <div style="padding:25px; text-align:center;">
        <h2 id="modalTitle" style="color:var(--neon-cyan);"></h2>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    // ================= SUPABASE CONFIG =================
    const SUPABASE_URL = 'https://svlhichdvqkjqdyxposi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM';

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isLoggedIn = false;

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
      if (isLoggedIn) {
        await supabase.auth.signOut();
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = "LOGIN";
        document.getElementById('upload-section').style.display = 'none';
        return;
      }

      const email = prompt("Enter Email:");
      const password = prompt("Enter Password:");

      if (email === "artaurex@gmail.com" && password === "Artaurex@1233") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
          alert("Supabase Error: " + error.message);
        } else {
          isLoggedIn = true;
          document.getElementById('loginBtn').textContent = "LOGOUT";
          document.getElementById('upload-section').style.display = 'block';
          alert("✅ Login Successful! Ab upload kar sakte ho.");
        }
      } else {
        alert("❌ Wrong Email or Password");
      }
    });

    // Upload Function
    async function uploadImage() {
      if (!isLoggedIn) return alert("Pehle Login Karo!");

      const file = document.getElementById('imageUpload').files[0];
      if (!file) return alert("Koi file select nahi kiya!");

      const type = document.getElementById('nftType').value;
      const filePath = `${type}/${Date.now()}-${file.name}`;

      const { error } = await supabase.storage
        .from('nfts')
        .upload(filePath, file, { upsert: true });

      if (error) {
        alert("Upload Failed: " + error.message);
      } else {
        alert("✅ Image Uploaded Successfully!");
        document.getElementById('imageUpload').value = '';
      }
    }

    // Sample Gallery Data
    const relicsData = [
      { title: "Ancient Sun Relic", img: "https://picsum.photos/id/1015/800/600", desc: "Eternal power of the lost sun" },
      { title: "Void Crystal Relic", img: "https://picsum.photos/id/201/800/600", desc: "Holds infinite darkness" }
    ];

    const totemsBestData = [
      { title: "Wolf Spirit Totem", img: "https://picsum.photos/id/251/800/600", desc: "Guardian of the wild" }
    ];

    const totemsLegendaryData = [
      { title: "Phoenix Rebirth", img: "https://picsum.photos/id/866/800/600", desc: "Rises from eternal flames" }
    ];

    function renderGallery(id, data) {
      const gallery = document.getElementById(id);
      gallery.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'nft-card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div class="info">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
        `;
        card.onclick = () => showModal(item);
        gallery.appendChild(card);
      });
    }

    function showModal(item) {
      document.getElementById('modalImage').src = item.img;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalDesc').textContent = item.desc;
      document.getElementById('modal').style.display = 'flex';
    }

    // Navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        if (btn.dataset.section) {
          document.getElementById(btn.dataset.section + '-section').classList.add('active');
        }
      });
    });

    document.querySelector('.close').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
    });

    // Initial Render
    window.onload = () => {
      renderGallery('relics-gallery', relicsData);
      renderGallery('totems-gallery', totemsBestData);
    };
  </script>
</body>
</html>
