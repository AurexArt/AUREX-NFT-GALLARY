<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREX</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Tumhara pura CSS yahin rakha hai (same as before) */
    body { margin:0; font-family: 'Segoe UI', sans-serif; background:#0a0a0a; color:#fff; }
    header { background:#111; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #ff6600; }
    h1 { margin:0; color:#ffcc66; }
    .header-buttons button { margin-left:10px; padding:8px 16px; background:#ff6600; border:none; color:white; border-radius:6px; cursor:pointer; }
    
    .bulk-delete-bar { 
      position:fixed; top:0; left:0; right:0; background:#222; padding:12px; 
      display:none; justify-content:space-between; align-items:center; z-index:1000;
    }
    #selectedCount { color: #ffdd88; font-size: 1.15rem; font-weight: bold; }

    .nav { display:flex; background:#111; padding:10px; gap:10px; }
    .nav-btn { padding:10px 20px; background:#222; border:none; color:#fff; border-radius:8px; cursor:pointer; }
    .nav-btn.active { background:#ff6600; color:black; }

    .section{ display:none; }
    .section.active{ display:block; }

    .legendary-banner{
      max-width:900px; margin:25px auto 35px; text-align:center;
      font-size:1.6rem; font-weight:bold; color:#ffcc66;
    }

    .gallery{
      width:100%; padding:15px; display:grid; 
      grid-template-columns:repeat(3,1fr); gap:12px;
    }
    .nft-card{
      background:#111; border-radius:12px; overflow:hidden; 
      border:1px solid #444; position:relative;
    }
    .nft-card img{
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block; cursor:pointer;
    }
    .nft-card img.error { filter: brightness(0.4); }

    .select-checkbox {
      position: absolute; top: 12px; right: 12px; width: 24px; height: 24px;
      z-index: 10; accent-color: #ffaa00; display: none;
    }
    .delete-mode .select-checkbox { display: block; }

    @media(min-width:768px){ .gallery{ grid-template-columns:repeat(5,1fr); } }
    @media(min-width:1024px){ .gallery{ grid-template-columns:repeat(6,1fr); padding:20px; } }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:9999; justify-content:center; align-items:center; }
    .modal-content { background:#111; padding:25px; border-radius:12px; max-width:90%; width:500px; text-align:center; }
    .close { position:absolute; top:15px; right:25px; font-size:40px; cursor:pointer; color:#ffaa00; }

    .loader-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; 
      justify-content:center; align-items:center; flex-direction:column; z-index:99999;
    }
    .loader{ width:80px; height:80px; border:7px solid #333; border-top:7px solid #ffaa00; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }
    .loader-text{ margin-top:25px; color:#ffaa00; font-size:1.5rem; font-weight:bold; }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
      <button id="deleteModeBtn" style="display:none;">🗑️</button>
    </div>
  </header>

  <div class="bulk-delete-bar" id="bulkDeleteBar">
    <span id="selectedCount">0 Selected</span>
    <button onclick="deleteSelectedNFTs()">DELETE SELECTED</button>
    <button onclick="exitDeleteMode()">CANCEL</button>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS <span id="relicsCount" class="section-count">(0)</span></button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <section id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </section>

  <section id="totems-section" class="section">
    <div style="text-align:center;padding:20px; display:flex; justify-content:center; gap:30px; flex-wrap:wrap;">
      <button class="nav-btn active" id="bestBtn">BEST <span id="bestCount" class="section-count">(0)</span></button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY <span id="legendaryCount" class="section-count">(0)</span></button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </section>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2>✦ UPLOAD NEW NFT ✦</h2>
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      <select id="nftSection">
        <option value="relics">Relics</option>
        <option value="totems">Totems</option>
      </select>
      <select id="totemType" style="display:none;">
        <option value="best">Best</option>
        <option value="legendary">Legendary</option>
      </select>
      <div class="modal-buttons" style="margin-top:20px;">
        <button onclick="uploadNFTs()">UPLOAD NOW</button>
        <button onclick="closeUploadModal()">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content" style="max-width:95%; width:fit-content;">
      <span class="close" id="closePreview">&times;</span>
      <img id="modalImage" src="" alt="NFT Image" style="max-height:85vh; border-radius:12px;">
    </div>
  </div>

  <!-- Loader -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Uploading NFTs...</div>
    <div id="progressText" style="margin-top:15px;color:#ffdd88;">0/0</div>
  </div>

  <script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [], totemsBestData = [], totemsLegendaryData = [];
    let isLoggedIn = false;
    let deleteMode = false;
    let selectedNFTs = new Set();

    async function loadNFTs(){
      try {
        const { data, error } = await supabaseClient
          .from("nfts_data")
          .select("*")
          .order("id", { ascending: false });

        if(error) throw error;

        relicsData = [];
        totemsBestData = [];
        totemsLegendaryData = [];

        data.forEach(item => {
          const nft = { id: item.id, img: item.img, section: item.section, type: item.type };
          if (item.section === "relics") relicsData.push(nft);
          else if (item.section === "totems") {
            if (item.type === "best") totemsBestData.push(nft);
            else if (item.type === "legendary") totemsLegendaryData.push(nft);
          }
        });

        updateCounts();
        renderAllGalleries();
      } catch(e) {
        console.error("Load NFTs Error:", e);
      }
    }

    function updateCounts(){
      document.getElementById("relicsCount").innerText = `(${relicsData.length})`;
      document.getElementById("bestCount").innerText = `(${totemsBestData.length})`;
      document.getElementById("legendaryCount").innerText = `(${totemsLegendaryData.length})`;
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = `<h2 style='text-align:center;width:100%;padding:40px;color:#ffaa00;'>No NFTs Yet</h2>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.innerHTML = `
          <input type="checkbox" class="select-checkbox" data-id="${item.id}">
          <img src="${item.img}" alt="NFT" onerror="this.classList.add('error'); this.src='https://via.placeholder.com/300x300?text=Image+Error'">
        `;

        card.querySelector(".select-checkbox").addEventListener("change", (e) => {
          toggleSelection(item.id, e.target.checked);
        });

        card.querySelector("img").onclick = () => {
          if(!deleteMode){
            document.getElementById("modalImage").src = item.img;
            document.getElementById("previewModal").style.display = "flex";
          }
        };
        container.appendChild(card);
      });
    }

    function renderAllGalleries(){
      renderGallery("relics-gallery", relicsData);
      renderGallery("totems-gallery", totemsBestData);
    }

    function toggleSelection(id, checked){
      if(checked) selectedNFTs.add(id);
      else selectedNFTs.delete(id);
      document.getElementById("selectedCount").innerText = `${selectedNFTs.size} Selected`;
    }

    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select at least one image");

      document.getElementById("loader").style.display = "flex";
      const loaderText = document.getElementById("loaderText");
      const progressText = document.getElementById("progressText");

      loaderText.innerText = "Uploading...";
      progressText.innerText = `0/${files.length}`;

      const section = document.getElementById("nftSection").value;
      const totemType = document.getElementById("totemType").value || null;

      let uploadedCount = 0;

      for(let i = 0; i < files.length; i++){
        const file = files[i];
        try{
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
          const path = `${section}/${fileName}`;

          // Upload to Storage
          const { error: uploadError } = await supabaseClient.storage
            .from("nfts")
            .upload(path, file, { upsert: true });

          if(uploadError) throw uploadError;

          // Get Public URL
          const { data: urlData } = supabaseClient.storage.from("nfts").getPublicUrl(path);

          console.log("✅ Uploaded URL:", urlData.publicUrl);

          // Save to Database
          const { error: dbError } = await supabaseClient.from("nfts_data").insert([{
            img: urlData.publicUrl,
            section: section,
            type: totemType
          }]);

          if(dbError) throw dbError;

          uploadedCount++;
          progressText.innerText = `${uploadedCount}/${files.length}`;
        } catch(err){
          console.error("Upload failed for file:", file.name, err);
        }
      }

      loaderText.innerText = "✅ Upload Complete!";
      progressText.innerText = `${uploadedCount} NFT(s) Uploaded`;

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        closeUploadModal();
        loadNFTs();
      }, 1500);
    }

    // Delete Functions
    async function deleteSelectedNFTs(){
      if(selectedNFTs.size === 0) return;
      if(!confirm(`Delete ${selectedNFTs.size} NFTs?`)) return;

      // Note: Storage se file delete karna optional hai (advanced)
      for(let id of selectedNFTs){
        await supabaseClient.from("nfts_data").delete().eq('id', id);
      }
      exitDeleteMode();
      loadNFTs();
    }

    function enterDeleteMode(){
      deleteMode = true;
      document.body.classList.add("delete-mode");
      document.getElementById("bulkDeleteBar").style.display = "flex";
      renderAllGalleries();
    }

    function exitDeleteMode(){
      deleteMode = false;
      selectedNFTs.clear();
      document.body.classList.remove("delete-mode");
      document.getElementById("bulkDeleteBar").style.display = "none";
      renderAllGalleries();
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
      document.getElementById("imageUpload").value = "";
    }

    // Event Listeners
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("deleteModeBtn").style.display = "none";
        exitDeleteMode();
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        document.getElementById("deleteModeBtn").style.display = "block";
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });

    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");
    document.getElementById("deleteModeBtn").addEventListener("click", () => deleteMode ? exitDeleteMode() : enterDeleteMode());

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    // Navigation
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
    });

    document.getElementById("bestBtn").addEventListener("click", () => {
      document.getElementById("bestBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
      document.getElementById("legendaryBtn").classList.add("active");
      document.getElementById("bestBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsLegendaryData);
    });

    // Initialize
    loadNFTs();
  </script>
</body>
</html>
