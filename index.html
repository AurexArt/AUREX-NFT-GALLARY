<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ 
      background: #C0C0C0;   /* New Warm Dark Background */
      color: #C0C0C0; 
      font-family:Arial,sans-serif; 
      overflow-x:hidden; 
    }

    header{ 
      text-align:center; 
      padding:80px 20px 30px; 
      position:relative; 
    }
    
    h1{ 
      font-size:5.2rem; 
      color:#ffaa00; 
      font-weight:400; 
      letter-spacing:8px; 
      font-family: 'Georgia', serif;
      text-transform: uppercase;
    }

    .header-buttons{ 
      position:absolute; 
      top:20px; 
      right:20px; 
      display:flex; 
      gap:10px; 
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button{
      padding:12px 24px; 
      background:transparent; 
      border:2px solid; 
      border-radius:50px; 
      cursor:pointer; 
      font-weight:bold; 
      transition:0.3s;
    }
    button:hover{ 
      color:black; 
      transform:scale(1.05); 
    }

    /* === Different Button Colors === */
    #loginBtn { 
      border-color: #ffd700; 
      color: #ffd700; 
    }
    #loginBtn:hover { background: #ffd700; }

    #uploadBtn { 
      border-color: #ffaa00; 
      color: #ffaa00; 
    }
    #uploadBtn:hover { background: #ffaa00; }

    #deleteModeBtn { 
      border-color: #ff6600; 
      color: #ff6600; 
    }
    #deleteModeBtn:hover { background: #ff6600; }

    .nav-btn { 
      border-color: #ffbb33; 
      color: #ffbb33; 
    }
    .nav-btn.active, .nav-btn:hover { 
      background: #ffbb33; 
      color: black; 
    }

    #bestBtn { 
      border-color: #ffcc00; 
      color: #ffcc00; 
    }
    #bestBtn.active, #bestBtn:hover { 
      background: #ffcc00; 
      color: black; 
    }

    #legendaryBtn { 
      border-color: #ff8800; 
      color: #ff8800; 
    }
    #legendaryBtn.active, #legendaryBtn:hover { 
      background: #ff8800; 
      color: black; 
    }

    /* Modal Buttons */
    .modal button {
      margin: 8px;
      padding: 12px 28px;
    }

    .modal button:first-of-type {
      border-color: #ffaa00;
      color: #ffaa00;
    }
    .modal button:last-of-type {
      border-color: #ff7744;
      color: #ff7744;
    }

    /* Bulk Delete */
    #bulkDeleteBar button:first-of-type {
      background: #ff3300;
      color: white;
      border: none;
    }

    .delete-mode-btn{
      background:#ff6600 !important;
      color:black !important;
    }

    .nav{ 
      display:flex; 
      justify-content:center; 
      gap:20px; 
      padding:20px; 
      background:#1f0c00; 
      flex-wrap:wrap; 
    }

    .section{ display:none; }
    .section.active{ display:block; }

    .legendary-banner{
      max-width:900px; 
      margin:25px auto 35px; 
      text-align:center;
      font-size:1.6rem; 
      font-weight:bold; 
      color:#ffcc66;
    }

    .section-count {
      font-size: 1.05rem;
      color: #ffdd88;
      margin-left: 6px;
    }

    .gallery{
      width:100%; 
      padding:8px; 
      display:grid; 
      grid-template-columns:repeat(3,1fr); 
      gap:8px;
    }
    .nft-card{
      background:#2a1600; 
      border-radius:12px; 
      overflow:hidden; 
      border:1px solid #664400;
      position:relative;
    }
    .nft-card img{
      width:100%; 
      aspect-ratio:1/1; 
      object-fit:cover; 
      display:block; 
      cursor:pointer;
    }

    .select-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      z-index: 10;
      accent-color: #ffaa00;
      display: none;
    }

    .delete-mode .select-checkbox {
      display: block;
    }

    @media(min-width:768px){ 
      .gallery{ grid-template-columns:repeat(5,1fr); gap:12px; } 
    }
    @media(min-width:1024px){ 
      .gallery{ grid-template-columns:repeat(6,1fr); gap:15px; padding:20px; } 
    }

    .modal{
      display:none; 
      position:fixed; 
      inset:0; 
      background:rgba(0,0,0,0.95);
      z-index:1000; 
      justify-content:center; 
      align-items:center; 
      padding:15px;
    }

    .modal-content{
      background:#1f0c00; 
      width:100%; 
      max-width:680px; 
      padding:12px; 
      position:relative;
      border-radius:18px;
    }

    .close{
      position:absolute; 
      top:8px; 
      right:18px; 
      font-size:38px;
      cursor:pointer; 
      color:#ffaa00;
      z-index: 11;
    }
    .close:hover{ 
      color:#ffcc66; 
      transform:rotate(90deg); 
    }

    .modal-content img{
      width:100%; 
      max-height:78vh; 
      object-fit:contain; 
      border-radius:12px;
      background:#110500;
    }

    .bulk-delete-bar {
      position: sticky;
      top: 0;
      background: #1f0c00;
      padding: 12px 20px;
      text-align: center;
      border-bottom: 2px solid #ff6600;
      display: none;
      z-index: 100;
    }

    .loader-overlay{
      position:fixed; 
      inset:0; 
      background:rgba(0,0,0,0.94);
      display:none; 
      justify-content:center; 
      align-items:center;
      flex-direction:column; 
      z-index:99999;
    }
    .loader{
      width:80px; 
      height:80px; 
      border:7px solid #333;
      border-top:7px solid #ffaa00; 
      border-radius:50%; 
      animation:spin 1s linear infinite;
    }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }

    .loader-text{ 
      margin-top:25px; 
      color:#ffaa00; 
      font-size:1.5rem; 
      font-weight:bold; 
    }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
      <button id="deleteModeBtn" style="display:none;">🗑️</button>
    </div>
  </header>

  <div class="bulk-delete-bar" id="bulkDeleteBar">
    <span id="selectedCount" style="margin-right:20px; font-weight:bold;">0 Selected</span>
    <button onclick="deleteSelectedNFTs()">DELETE SELECTED</button>
    <button onclick="exitDeleteMode()">CANCEL</button>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS <span id="relicsCount" class="section-count">(0)</span></button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <section id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </section>

  <section id="totems-section" class="section">
    <div style="text-align:center;padding:20px; display:flex; justify-content:center; gap:30px; flex-wrap:wrap;">
      <button class="nav-btn active" id="bestBtn">BEST <span id="bestCount" class="section-count">(0)</span></button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY <span id="legendaryCount" class="section-count">(0)</span></button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </section>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2 style="color:#ffaa00; text-align:center; margin-bottom:25px;">✦ UPLOAD NEW NFT ✦</h2>
      
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      
      <select id="nftSection" style="margin:15px 0; padding:10px; width:100%;">
        <option value="relics">Relics</option>
        <option value="totems">Totems</option>
      </select>
      
      <select id="totemType" style="display:none; margin-bottom:15px; padding:10px; width:100%;">
        <option value="best">Best</option>
        <option value="legendary">Legendary</option>
      </select>
      
      <div style="margin-top:30px; text-align:center;">
        <button onclick="uploadNFTs()">UPLOAD NOW</button>
        <button onclick="closeUploadModal()">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" id="closePreview">&times;</span>
      <img id="modalImage" src="" alt="NFT Image">
    </div>
  </div>

  <!-- Loader -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Processing...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [];
    let totemsBestData = [];
    let totemsLegendaryData = [];
    let isLoggedIn = false;
    let deleteMode = false;
    let selectedNFTs = new Set();

    async function loadNFTs(){
      const { data } = await supabaseClient.from("nfts_data").select("*").order("id", { ascending: false });

      relicsData = [];
      totemsBestData = [];
      totemsLegendaryData = [];

      data.forEach(item => {
        const nft = { id: item.id, img: item.img, section: item.section, type: item.type };
        if (item.section === "relics") relicsData.push(nft);
        else if (item.section === "totems") {
          if (item.type === "best") totemsBestData.push(nft);
          else if (item.type === "legendary") totemsLegendaryData.push(nft);
        }
      });

      updateCounts();
      renderAllGalleries();
    }

    function updateCounts(){
      document.getElementById("relicsCount").innerText = `(${relicsData.length})`;
      document.getElementById("bestCount").innerText = `(${totemsBestData.length})`;
      document.getElementById("legendaryCount").innerText = `(${totemsLegendaryData.length})`;
    }

    function renderAllGalleries(){
      renderGallery("relics-gallery", relicsData);
      renderGallery("totems-gallery", totemsBestData);
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = "<h2 style='text-align:center;width:100%;padding:40px;color:#ffaa00;'>No NFTs Yet</h2>";
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        
        card.innerHTML = `
          <input type="checkbox" class="select-checkbox" data-id="${item.id}">
          <img src="${item.img}" alt="NFT">
        `;

        const checkbox = card.querySelector(".select-checkbox");
        checkbox.addEventListener("change", () => toggleSelection(item.id, checkbox.checked));

        card.querySelector("img").onclick = () => {
          if(!deleteMode){
            document.getElementById("modalImage").src = item.img;
            document.getElementById("previewModal").style.display = "flex";
          }
        };

        container.appendChild(card);
      });
    }

    function toggleSelection(id, isChecked){
      if(isChecked) selectedNFTs.add(id);
      else selectedNFTs.delete(id);
      document.getElementById("selectedCount").innerText = `${selectedNFTs.size} Selected`;
    }

    async function deleteSelectedNFTs(){
      if(selectedNFTs.size === 0) return;
      if(!confirm(`Delete ${selectedNFTs.size} NFTs permanently?`)) return;

      document.getElementById("loader").style.display = "flex";
      document.getElementById("loaderText").innerText = "Deleting NFTs...";

      for(let id of selectedNFTs){
        try {
          const { data: nft } = await supabaseClient.from("nfts_data").select("img").eq("id", id).single();
          if(nft && nft.img){
            const imagePath = nft.img.split("/nfts/")[1];
            if(imagePath) await supabaseClient.storage.from("nfts").remove([imagePath]);
          }
          await supabaseClient.from("nfts_data").delete().eq("id", id);
        } catch(err){ console.error(err); }
      }

      selectedNFTs.clear();
      document.getElementById("loaderText").innerText = "✅ Deletion Complete!";
      
      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        exitDeleteMode();
        loadNFTs();
      }, 1500);
    }

    function enterDeleteMode(){
      deleteMode = true;
      document.body.classList.add("delete-mode");
      document.getElementById("deleteModeBtn").classList.add("delete-mode-btn");
      document.getElementById("bulkDeleteBar").style.display = "block";
      renderAllGalleries();
    }

    function exitDeleteMode(){
      deleteMode = false;
      selectedNFTs.clear();
      document.body.classList.remove("delete-mode");
      document.getElementById("deleteModeBtn").classList.remove("delete-mode-btn");
      document.getElementById("bulkDeleteBar").style.display = "none";
      renderAllGalleries();
    }

    // Login
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("deleteModeBtn").style.display = "none";
        exitDeleteMode();
        alert("Logged Out");
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        document.getElementById("deleteModeBtn").style.display = "block";
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });

    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");
    document.getElementById("deleteModeBtn").addEventListener("click", () => deleteMode ? exitDeleteMode() : enterDeleteMode());

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = () => document.getElementById("uploadModal").style.display = "none";

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") document.getElementById("uploadModal").style.display = "none";
    };

    // Navigation
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
      renderGallery("relics-gallery", relicsData);
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("bestBtn").addEventListener("click", () => {
      document.getElementById("bestBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
      document.getElementById("legendaryBtn").classList.add("active");
      document.getElementById("bestBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsLegendaryData);
    });

    loadNFTs();
  </script>
</body>
</html>
