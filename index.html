<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0a001f;
      color:white;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:60px 20px 20px;
      position:relative;
    }

    h1{
      font-size:5rem;
      color:#ff00ff;
      text-shadow:0 0 25px #ff00ff;
      margin-bottom:15px;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:12px;
    }

    button{
      padding:12px 28px;
      background:transparent;
      border:2px solid #00ffff;
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:#00ffff;
      color:black;
      transform:scale(1.05);
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:20px;
      background:#140029;
      flex-wrap:wrap;
    }

    .nav-btn.active{
      background:#ff00ff;
      border-color:#ff00ff;
      color:black;
    }

    .section{display:none;}
    .section.active{display:block;}

    .legendary-banner{
      max-width:900px;
      margin:25px auto;
      padding:20px;
      text-align:center;
      font-size:1.5rem;
      font-weight:bold;
      border-radius:15px;
      color:black;
      background:linear-gradient(45deg,#ffd700,#ffaa00);
      box-shadow:0 0 25px gold;
    }

    .gallery{
      width:100%;
      padding:8px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
    }

    @media(min-width:768px){
      .gallery{grid-template-columns:repeat(5,1fr);}
    }

    @media(min-width:1024px){
      .gallery{grid-template-columns:repeat(6,1fr);}
    }

    .nft-card{
      background:#1d0037;
      border-radius:10px;
      overflow:hidden;
      border:1px solid #440066;
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
      cursor:pointer;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      z-index:1000;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal-content{
      background:#1a0033;
      width:100%;
      max-width:550px;
      border-radius:20px;
      padding:25px;
      position:relative;
      border:2px solid #ff00ff;
    }

    .close{
      position:absolute;
      top:12px;
      right:18px;
      font-size:32px;
      cursor:pointer;
      color:#ff00ff;
    }

    .modal-content img{
      width:100%;
      max-height:420px;
      object-fit:contain;
      border-radius:12px;
      margin-bottom:15px;
      border:1px solid #440066;
    }

    .modal-content input,
    .modal-content textarea{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:10px;
      background:#2a004d;
      color:white;
      font-size:1rem;
    }

    #saveBtn{
      margin-top:15px;
      padding:12px;
      width:100%;
      background:#00ff88;
      color:black;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .desc{
      opacity:0.8;
      margin:10px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>AUREX</h1>
  <div class="header-buttons">
    <button id="loginBtn">LOGIN</button>
    <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn active" id="relicsBtn">RELICS</button>
  <button class="nav-btn" id="totemsBtn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
  <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
  <div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
  <div class="gallery" id="totems-gallery"></div>
</section>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <span class="close" id="closePreview">&times;</span>

    <img id="modalImage">
    <h2 id="modalTitleDisplay"></h2>

    <!-- ✅ FIXED DESCRIPTION -->
    <p id="modalDescDisplay" class="desc"></p>

    <input type="text" id="editTitle" style="display:none;">
    <textarea id="editDesc" style="display:none;"></textarea>

    <button id="saveBtn" style="display:none;">SAVE CHANGES</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let relicsData = [];
let totemsBestData = [];
let totemsLegendaryData = [];
let isLoggedIn = false;
let currentNFT = null;

/* LOAD DATA */
async function loadNFTs(){
  const { data } = await supabaseClient
    .from("nfts_data")
    .select("*")
    .order("id", { ascending: false });

  relicsData = [];
  totemsBestData = [];

  data.forEach(item => {
    const nft = {
      id: item.id,
      title: item.title,
      desc: item.description,
      img: item.img,
      section: item.section,
      type: item.type
    };

    if(item.section === "relics") relicsData.push(nft);
    if(item.section === "totems" && item.type === "best") totemsBestData.push(nft);
  });

  render("relics-gallery", relicsData);
  render("totems-gallery", totemsBestData);
}

/* RENDER */
function render(id, data){
  const el = document.getElementById(id);
  el.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "nft-card";

    div.innerHTML = `<img src="${item.img}">`;

    div.querySelector("img").onclick = () => openPreview(item);

    el.appendChild(div);
  });
}

/* OPEN PREVIEW */
function openPreview(item){
  currentNFT = item;

  document.getElementById("previewModal").style.display = "flex";
  document.getElementById("modalImage").src = item.img;
  document.getElementById("modalTitleDisplay").innerText = item.title;

  // ✅ FIX DESCRIPTION DISPLAY
  document.getElementById("modalDescDisplay").innerText = item.desc || "No description";

  if(isLoggedIn){
    document.getElementById("editTitle").style.display = "block";
    document.getElementById("editDesc").style.display = "block";
    document.getElementById("saveBtn").style.display = "block";

    document.getElementById("editTitle").value = item.title;
    document.getElementById("editDesc").value = item.desc || "";
  } else {
    document.getElementById("editTitle").style.display = "none";
    document.getElementById("editDesc").style.display = "none";
    document.getElementById("saveBtn").style.display = "none";
  }
}

/* SAVE TO SUPABASE */
document.getElementById("saveBtn").onclick = async () => {
  const newTitle = document.getElementById("editTitle").value;
  const newDesc = document.getElementById("editDesc").value;

  await supabaseClient
    .from("nfts_data")
    .update({
      title: newTitle,
      description: newDesc
    })
    .eq("id", currentNFT.id);

  currentNFT.title = newTitle;
  currentNFT.desc = newDesc;

  document.getElementById("modalTitleDisplay").innerText = newTitle;
  document.getElementById("modalDescDisplay").innerText = newDesc;

  loadNFTs();
};

/* LOGIN */
document.getElementById("loginBtn").onclick = () => {
  const pass = prompt("Enter Secret");
  if(pass === "tmkc"){
    isLoggedIn = true;
    document.getElementById("uploadBtn").style.display = "block";
    alert("Logged In");
  }
};

/* CLOSE */
document.getElementById("closePreview").onclick = () => {
  document.getElementById("previewModal").style.display = "none";
};

/* INIT */
loadNFTs();
</script>

</body>
</html>
