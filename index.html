<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:#0a001f; color:white; font-family:Arial,sans-serif; overflow-x:hidden; }

    header{ text-align:center; padding:60px 20px 20px; position:relative; }
    h1{ font-size:5rem; color:#ff00ff; text-shadow:0 0 25px #ff00ff; margin-bottom:15px; }

    .header-buttons{ position:absolute; top:20px; right:20px; display:flex; gap:12px; }

    button{
      padding:12px 28px; background:transparent; border:2px solid #00ffff;
      color:#00ffff; border-radius:50px; cursor:pointer; font-weight:bold; transition:0.3s;
    }
    button:hover{ background:#00ffff; color:black; transform:scale(1.05); }

    .nav{ display:flex; justify-content:center; gap:20px; padding:20px; background:#140029; flex-wrap:wrap; }
    .nav-btn.active{ background:#ff00ff; border-color:#ff00ff; color:black; }

    .section{ display:none; }
    .section.active{ display:block; }

    .legendary-banner{
      max-width:900px; margin:25px auto; padding:20px; text-align:center;
      font-size:1.5rem; font-weight:bold; border-radius:15px; color:black;
      background:linear-gradient(45deg,#ffd700,#ffaa00); box-shadow:0 0 25px gold;
    }

    .gallery{
      width:100%; padding:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    }
    .nft-card{
      background:#1d0037; border-radius:10px; overflow:hidden; border:1px solid #440066;
    }
    .nft-card img{
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block; cursor:pointer;
    }

    @media(min-width:768px){ .gallery{ grid-template-columns:repeat(5,1fr); gap:10px; } }
    @media(min-width:1024px){ .gallery{ grid-template-columns:repeat(6,1fr); gap:15px; padding:20px; } }

    /* ==================== STYLISH UPLOAD MODAL ==================== */
    .modal{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
      z-index:1000; justify-content:center; align-items:center; padding:20px;
    }

    .modal-content{
      background:linear-gradient(145deg, #1f003d, #2a004d);
      width:100%; max-width:520px; border-radius:24px;
      padding:30px; position:relative; border:3px solid #ff00ff;
      box-shadow:0 0 40px rgba(255, 0, 255, 0.4);
      animation:popup 0.4s ease;
    }

    @keyframes popup{
      from{ opacity:0; transform:scale(0.7); }
      to{ opacity:1; transform:scale(1); }
    }

    .close{
      position:absolute; top:15px; right:20px; font-size:36px;
      cursor:pointer; color:#ff00ff; transition:0.3s;
    }
    .close:hover{ color:#ff66ff; transform:rotate(90deg); }

    .modal-content h2{
      text-align:center; color:#ff00ff; font-size:2rem; margin-bottom:25px;
      text-shadow:0 0 15px #ff00ff;
    }

    .modal-content input,
    .modal-content textarea,
    .modal-content select{
      width:100%; padding:14px; margin:12px 0;
      border:none; border-radius:12px; background:#3a0066;
      color:white; font-size:1rem; transition:0.3s;
    }

    .modal-content input:focus,
    .modal-content textarea:focus,
    .modal-content select:focus{
      outline:none; background:#4a0088; box-shadow:0 0 0 3px #ff00ff;
    }

    .modal-content textarea{ resize:vertical; min-height:110px; }

    .upload-actions{
      margin-top:25px; display:flex; gap:15px; justify-content:center;
    }

    .upload-actions button{
      padding:14px 32px; border-radius:50px; font-size:1.1rem;
      transition:0.3s;
    }

    .upload-actions button:first-child{
      background:linear-gradient(45deg, #ff00ff, #00ffff);
      color:black; border:none;
    }
    .upload-actions button:first-child:hover{
      transform:scale(1.08); box-shadow:0 0 25px #ff00ff;
    }

    .delete-btn{
      margin-top:15px; width:100%; padding:12px; border:none;
      border-radius:10px; background:#ff0033; color:white; cursor:pointer;
    }

    .loader-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,0.92);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:99999;
    }
    .loader{
      width:80px; height:80px; border:7px solid #333;
      border-top:7px solid #00ffff; border-radius:50%; animation:spin 1s linear infinite;
    }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }
    .loader-text{ margin-top:20px; color:#00ffff; font-size:1.3rem; font-weight:bold; }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS</button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <section id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </section>

  <section id="totems-section" class="section">
    <div style="text-align:center;padding:20px;">
      <button class="nav-btn active" id="bestBtn">BEST</button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </section>

  <!-- UPLOAD MODAL (Stylish) -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2>✦ UPLOAD NEW NFT ✦</h2>
      
      <input type="text" id="nftName" placeholder="NFT Name"/>
      <textarea id="nftDesc" rows="4" placeholder="Description..."></textarea>
      
      <select id="nftSection">
        <option value="relics">Relics</option>
        <option value="totems">Totems</option>
      </select>
      <select id="totemType" style="display:none;">
        <option value="best">Best</option>
        <option value="legendary">Legendary</option>
      </select>
      
      <input type="file" id="imageUpload" accept="image/*" multiple/>

      <div class="upload-actions">
        <button onclick="uploadNFTs()">UPLOAD NOW</button>
        <button onclick="closeUploadModal()">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- PREVIEW MODAL -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" id="closePreview">&times;</span>
      
      <img id="modalImage" src="" alt="NFT">
      <h2 id="modalTitleDisplay"></h2>
      <p id="modalDesc"></p>

      <input type="text" id="editTitle" placeholder="NFT Name" style="display:none;"/>
      <textarea id="editDesc" rows="5" placeholder="Description" style="display:none;"></textarea>
      
      <button id="saveBtn" style="display:none; margin-top:15px; padding:12px; width:100%; background:#00ff88; color:black; border:none; border-radius:10px; font-weight:bold;">
        SAVE CHANGES
      </button>
    </div>
  </div>

  <!-- LOADER -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Uploading NFT...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [];
    let totemsBestData = [];
    let totemsLegendaryData = [];
    let isLoggedIn = false;
    let currentNFT = null;

    // SAVE CHANGES
    document.getElementById("saveBtn").addEventListener("click", async () => {
      if (!currentNFT) return;

      const newTitle = document.getElementById("editTitle").value.trim();
      const newDesc = document.getElementById("editDesc").value.trim();

      if (!newTitle) {
        alert("NFT Name cannot be empty!");
        return;
      }

      const { error } = await supabaseClient
        .from("nfts_data")
        .update({ title: newTitle, description: newDesc })
        .eq("id", currentNFT.id);

      if (error) {
        console.error(error);
        alert("Save Failed!");
        return;
      }

      alert("Changes Saved Successfully!");

      currentNFT.title = newTitle;
      currentNFT.desc = newDesc;

      document.getElementById("modalTitleDisplay").innerText = newTitle;
      await loadNFTs();
    });

    async function loadNFTs(){
      const { data, error } = await supabaseClient
        .from("nfts_data")
        .select("*")
        .order("id", { ascending: false });

      if (error) { console.log(error); return; }

      relicsData = [];
      totemsBestData = [];
      totemsLegendaryData = [];

      data.forEach((item) => {
        const nft = {
          id: item.id,
          title: item.title,
          desc: item.description || "",
          img: item.img,
          section: item.section,
          type: item.type
        };

        if (item.section === "relics") relicsData.push(nft);
        else if (item.section === "totems") {
          if (item.type === "best") totemsBestData.push(nft);
          else if (item.type === "legendary") totemsLegendaryData.push(nft);
        }
      });

      renderGallery("relics-gallery", relicsData);
      renderGallery("totems-gallery", totemsBestData);
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = "<h2 style='text-align:center;width:100%; padding:20px;'>No NFTs Yet</h2>";
        return;
      }

      data.forEach((item) => {
        const card = document.createElement("div");
        card.className = "nft-card";

        card.innerHTML = `<img src="${item.img}" alt="${item.title}">`;

        if(isLoggedIn){
          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerText = "DELETE NFT";
          delBtn.onclick = () => deleteNFT(item.id);
          card.appendChild(delBtn);
        }

        card.querySelector("img").onclick = () => openPreview(item);
        container.appendChild(card);
      });
    }

    function openPreview(item){
      currentNFT = item;

      document.getElementById("previewModal").style.display = "flex";
      document.getElementById("modalImage").src = item.img;
      document.getElementById("modalTitleDisplay").innerText = item.title;
      document.getElementById("modalDesc").innerText = item.desc || "No description";

      if(isLoggedIn){
        document.getElementById("editTitle").style.display = "block";
        document.getElementById("editDesc").style.display = "block";
        document.getElementById("saveBtn").style.display = "block";
        document.getElementById("editTitle").value = item.title;
        document.getElementById("editDesc").value = item.desc || "";
      } else {
        document.getElementById("editTitle").style.display = "none";
        document.getElementById("editDesc").style.display = "none";
        document.getElementById("saveBtn").style.display = "none";
      }
    }

    function closePreview(){
      document.getElementById("previewModal").style.display = "none";
    }

    async function deleteNFT(id){
      if(!confirm("Delete this NFT permanently?")) return;

      const { error } = await supabaseClient
        .from("nfts_data")
        .delete()
        .eq("id", id);

      if(error){
        alert("Delete Failed");
      } else {
        await loadNFTs();
      }
    }

    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0){
        alert("Please select at least one image");
        return;
      }

      document.getElementById("loader").style.display = "flex";

      const section = document.getElementById("nftSection").value;
      const totemType = document.getElementById("totemType").value;
      const title = document.getElementById("nftName").value.trim() || "Untitled NFT";
      const desc = document.getElementById("nftDesc").value.trim() || "No description";

      let uploadedCount = 0;

      for(let file of files){
        try{
          const fileExt = file.name.split(".").pop();
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
          const path = `${section}/${fileName}`;

          const { error: uploadError } = await supabaseClient.storage
            .from("nfts")
            .upload(path, file, { cacheControl: "1", upsert: true });

          if(uploadError) continue;

          const { data: urlData } = supabaseClient.storage
            .from("nfts")
            .getPublicUrl(path);

          await supabaseClient.from("nfts_data").insert([{
            title: title,
            description: desc,
            img: urlData.publicUrl,
            section: section,
            type: totemType
          }]);

          uploadedCount++;
        } catch(err){
          console.log(err);
        }
      }

      document.getElementById("loaderText").innerText = `${uploadedCount} NFT(s) Uploaded Successfully`;

      await loadNFTs();

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        document.getElementById("loaderText").innerText = "Uploading NFT...";
        closeUploadModal();
      }, 1800);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
    }

    // LOGIN
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        loadNFTs();
        alert("Logged Out");
        return;
      }

      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        loadNFTs();
        alert("Login Successful");
      } else {
        alert("Wrong Secret Word");
      }
    });

    // Other Listeners
    document.getElementById("uploadBtn").addEventListener("click", () => {
      document.getElementById("uploadModal").style.display = "flex";
    });

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = closePreview;
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") closePreview();
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
      renderGallery("relics-gallery", relicsData);
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("bestBtn").addEventListener("click", () => {
      document.getElementById("bestBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
      document.getElementById("legendaryBtn").classList.add("active");
      document.getElementById("bestBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsLegendaryData);
    });

    // Initial Load
    loadNFTs();
  </script>
</body>
</html>
