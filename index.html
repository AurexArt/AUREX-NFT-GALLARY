<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0a001f;
      color:white;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:60px 20px 20px;
      position:relative;
    }

    h1{
      font-size:5rem;
      color:#ff00ff;
      text-shadow:0 0 25px #ff00ff;
      margin-bottom:15px;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:12px;
    }

    button{
      padding:10px 22px;
      background:transparent;
      border:2px solid #00ffff;
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
      font-size:0.9rem;
    }

    button:hover{
      background:#00ffff;
      color:black;
      transform:scale(1.05);
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:20px;
      background:#140029;
      flex-wrap:wrap;
    }

    .nav-btn.active{
      background:#ff00ff;
      border-color:#ff00ff;
      color:black;
    }

    .section{
      display:none;
    }

    .section.active{
      display:block;
    }

    .legendary-banner{
      max-width:900px;
      margin:20px auto;
      padding:16px;
      text-align:center;
      font-size:1.2rem;
      font-weight:bold;
      border-radius:15px;
      color:black;
      background:linear-gradient(45deg,#ffd700,#ffaa00);
      box-shadow:0 0 25px gold;
    }

    /* =========================
       GALLERY FIXED
    ========================= */

    .gallery{
      width:100%;
      padding:20px;
      display:grid;

      /* LAPTOP = 6 IMAGES */
      grid-template-columns:repeat(6,1fr);

      gap:12px;
    }

    .nft-card{
      background:#1d0037;
      border-radius:14px;
      overflow:hidden;
      transition:0.3s;
      border:1px solid #440066;
    }

    .nft-card:hover{
      transform:translateY(-5px) scale(1.03);
      box-shadow:0 0 20px #ff00ff66;
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      cursor:pointer;
      display:block;
    }

    .card-content{
      padding:8px;
      text-align:center;
    }

    .card-content h3{
      margin-bottom:5px;
      color:#ff00ff;
      font-size:0.85rem;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .card-content p{
      color:#ccc;
      font-size:0.7rem;
      line-height:1.2;
      max-height:32px;
      overflow:hidden;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      z-index:1000;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal-content{
      background:#1a0033;
      width:100%;
      max-width:550px;
      border-radius:20px;
      padding:25px;
      position:relative;
      border:2px solid #ff00ff;
      animation:popup 0.25s ease;
    }

    @keyframes popup{
      from{
        opacity:0;
        transform:scale(0.8);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .close{
      position:absolute;
      top:12px;
      right:18px;
      font-size:32px;
      cursor:pointer;
      color:#ff00ff;
    }

    .modal-content img{
      width:100%;
      max-height:500px;
      object-fit:contain;
      border-radius:12px;
      margin-bottom:15px;
    }

    .modal-content h2{
      margin-bottom:10px;
      text-align:center;
      color:#ff00ff;
    }

    .modal-content p{
      text-align:center;
      color:#ddd;
    }

    .modal-content input,
    .modal-content textarea,
    .modal-content select{
      width:100%;
      padding:14px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      background:#2a004d;
      color:white;
      font-size:1rem;
    }

    .upload-actions{
      margin-top:20px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .delete-btn{
      margin-top:10px;
      width:100%;
      padding:8px;
      border:none;
      border-radius:10px;
      background:#ff0033;
      color:white;
      cursor:pointer;
      font-weight:bold;
      font-size:0.7rem;
    }

    .delete-btn:hover{
      background:#ff3355;
    }

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:99999;
    }

    .loader{
      width:80px;
      height:80px;
      border:7px solid #333;
      border-top:7px solid #00ffff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .loader-text{
      margin-top:20px;
      color:#00ffff;
      font-size:1.3rem;
      font-weight:bold;
    }

    /* TABLET */

    @media(max-width:1024px){

      .gallery{
        grid-template-columns:repeat(4,1fr);
      }

    }

    /* MOBILE */

    @media(max-width:768px){

      h1{
        font-size:3rem;
      }

      .header-buttons{
        position:static;
        justify-content:center;
        margin-top:20px;
      }

      /* MOBILE = 4 IMAGES */
      .gallery{
        grid-template-columns:repeat(4,1fr);
        gap:8px;
        padding:10px;
      }

      .card-content{
        padding:5px;
      }

      .card-content h3{
        font-size:0.6rem;
      }

      .card-content p{
        display:none;
      }

      button{
        padding:8px 14px;
        font-size:0.7rem;
      }

    }

  </style>
</head>

<body>

  <header>

    <h1>AUREX</h1>

    <div class="header-buttons">

      <button id="loginBtn">
        LOGIN
      </button>

      <button id="uploadBtn" style="display:none;">
        UPLOAD NFT
      </button>

    </div>

  </header>

  <!-- NAVIGATION -->

  <nav class="nav">

    <button class="nav-btn active" id="relicsBtn">
      RELICS
    </button>

    <button class="nav-btn" id="totemsBtn">
      TOTEMS
    </button>

  </nav>

  <!-- RELICS -->

  <section id="relics-section" class="section active">

    <div class="legendary-banner">
      ALL RELICS ARE LEGENDARY
    </div>

    <div class="gallery" id="relics-gallery"></div>

  </section>

  <!-- TOTEMS -->

  <section id="totems-section" class="section">

    <div style="text-align:center;padding:20px;">

      <button class="nav-btn active" id="bestBtn">
        BEST
      </button>

      <button class="nav-btn" id="legendaryBtn">
        LEGENDARY
      </button>

    </div>

    <div class="gallery" id="totems-gallery"></div>

  </section>

  <!-- UPLOAD MODAL -->

  <div class="modal" id="uploadModal">

    <div class="modal-content">

      <span class="close" id="closeUpload">
        &times;
      </span>

      <h2>Upload NFT</h2>

      <input type="text" id="nftName" placeholder="NFT Name"/>

      <textarea id="nftDesc" rows="4" placeholder="Description"></textarea>

      <select id="nftSection">

        <option value="relics">
          Relics
        </option>

        <option value="totems">
          Totems
        </option>

      </select>

      <select id="totemType" style="display:none;">

        <option value="best">
          Best
        </option>

        <option value="legendary">
          Legendary
        </option>

      </select>

      <input type="file" id="imageUpload" accept="image/*" multiple/>

      <div class="upload-actions">

        <button onclick="uploadNFTs()">
          UPLOAD
        </button>

        <button onclick="closeUploadModal()">
          CANCEL
        </button>

      </div>

    </div>

  </div>

  <!-- PREVIEW MODAL -->

  <div class="modal" id="previewModal">

    <div class="modal-content">

      <span class="close" id="closePreview">
        &times;
      </span>

      <img id="modalImage" src=""/>

      <h2 id="modalTitle"></h2>

      <p id="modalDesc"></p>

    </div>

  </div>

  <!-- LOADER -->

  <div class="loader-overlay" id="loader">

    <div class="loader"></div>

    <div class="loader-text" id="loaderText">
      Uploading NFT...
    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://svlhichdvqkjqdyxposi.supabase.co";

    const SUPABASE_KEY =
      "YOUR_SUPABASE_KEY";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let relicsData = [];

    let totemsBestData = [];

    let totemsLegendaryData = [];

    let isLoggedIn = false;

    relicsData.push({
      title:"Royal Doge",
      desc:"Legendary Royal NFT",
      img:"https://picsum.photos/600/600?1"
    });

    relicsData.push({
      title:"Cyber Crown",
      desc:"Neon Relic Collection",
      img:"https://picsum.photos/600/600?2"
    });

    function renderGallery(containerId,data){

      const container =
        document.getElementById(containerId);

      container.innerHTML = "";

      if(data.length === 0){

        container.innerHTML =
          "<h2 style='text-align:center;width:100%;'>No NFTs Yet</h2>";

        return;
      }

      data.forEach((item,index)=>{

        const card =
          document.createElement("div");

        card.className = "nft-card";

        card.innerHTML = `

          <img src="${item.img}" alt="${item.title}">

          <div class="card-content">

            <h3>${item.title}</h3>

            <p>${item.desc}</p>

            ${
              isLoggedIn
              ?
              `
              <button
                class="delete-btn"
                onclick="deleteNFT('${containerId}',${index})">

                DELETE NFT

              </button>
              `
              :
              ""
            }

          </div>
        `;

        card.querySelector("img").onclick = ()=>{
          openPreview(item);
        };

        container.appendChild(card);

      });

    }

    function openPreview(item){

      document.getElementById("previewModal")
      .style.display = "flex";

      document.getElementById("modalImage")
      .src = item.img;

      document.getElementById("modalTitle")
      .innerText = item.title;

      document.getElementById("modalDesc")
      .innerText = item.desc;

    }

    function closePreview(){

      document.getElementById("previewModal")
      .style.display = "none";

    }

    function closeUploadModal(){

      document.getElementById("uploadModal")
      .style.display = "none";

    }

    document.getElementById("loginBtn")
    .addEventListener("click",()=>{

      if(isLoggedIn){

        isLoggedIn = false;

        document.getElementById("loginBtn")
        .innerText = "LOGIN";

        document.getElementById("uploadBtn")
        .style.display = "none";

        refreshGallery();

        alert("Logged Out");

        return;

      }

      const secretWord =
        prompt("Enter Secret Word");

      if(
        secretWord === "tmkc"
        ||
        secretWord === "Tmkc"
      ){

        isLoggedIn = true;

        document.getElementById("loginBtn")
        .innerText = "LOGOUT";

        document.getElementById("uploadBtn")
        .style.display = "block";

        refreshGallery();

        alert("Login Successful");

      }else{

        alert("Wrong Secret Word");

      }

    });

    function refreshGallery(){

      renderGallery(
        "relics-gallery",
        relicsData
      );

      renderGallery(
        "totems-gallery",
        totemsBestData
      );

    }

    document.getElementById("closePreview")
    .onclick = closePreview;

    document.getElementById("closeUpload")
    .onclick = closeUploadModal;

    renderGallery(
      "relics-gallery",
      relicsData
    );

    renderGallery(
      "totems-gallery",
      totemsBestData
    );

  </script>

</body>
</html>
