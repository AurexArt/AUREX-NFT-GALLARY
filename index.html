<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0a001f;
      color:white;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:60px 20px 20px;
      position:relative;
    }

    h1{
      font-size:5rem;
      color:#ff00ff;
      text-shadow:0 0 25px #ff00ff;
      margin-bottom:15px;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:12px;
    }

    button{
      padding:12px 28px;
      background:transparent;
      border:2px solid #00ffff;
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:#00ffff;
      color:black;
      transform:scale(1.05);
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:20px;
      background:#140029;
      flex-wrap:wrap;
    }

    .nav-btn.active{
      background:#ff00ff;
      border-color:#ff00ff;
      color:black;
    }

    .section{
      display:none;
    }

    .section.active{
      display:block;
    }

    .legendary-banner{
      max-width:900px;
      margin:25px auto;
      padding:20px;
      text-align:center;
      font-size:1.5rem;
      font-weight:bold;
      border-radius:15px;
      color:black;
      background:linear-gradient(45deg,#ffd700,#ffaa00);
      box-shadow:0 0 25px gold;
    }

   .gallery{
  width:100%;
  padding:8px;
  display:grid;

  /* MOBILE PE 3 NFT EK ROW */
  grid-template-columns:repeat(3,1fr);

  gap:6px;
}

.nft-card{
  width:100%;
  min-width:0;
  background:#1d0037;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #440066;
}

.nft-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.card-content{
  padding:5px;
  text-align:center;
}

.card-content h3{
  font-size:0.65rem;
  margin-bottom:3px;
  color:#ff00ff;
}

.card-content p{
  font-size:0.5rem;
  color:#ddd;
  line-height:1.2;
}

/* TABLET */

@media(min-width:768px){

  .gallery{
    grid-template-columns:repeat(5,1fr);
    gap:10px;
  }

}

/* LAPTOP */

@media(min-width:1024px){

  .gallery{
    grid-template-columns:repeat(6,1fr);
    gap:15px;
    padding:20px;
  }

  .card-content h3{
    font-size:0.9rem;
  }

  .card-content p{
    font-size:0.7rem;
  }

}
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      z-index:1000;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal-content{
      background:#1a0033;
      width:100%;
      max-width:550px;
      border-radius:20px;
      padding:25px;
      position:relative;
      border:2px solid #ff00ff;
      animation:popup 0.25s ease;
    }

    @keyframes popup{
      from{
        opacity:0;
        transform:scale(0.8);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .close{
      position:absolute;
      top:12px;
      right:18px;
      font-size:32px;
      cursor:pointer;
      color:#ff00ff;
    }

    .modal-content img{
      width:100%;
      max-height:500px;
      object-fit:contain;
      border-radius:12px;
      margin-bottom:15px;
    }

    .modal-content h2{
      margin-bottom:10px;
      text-align:center;
      color:#ff00ff;
    }

    .modal-content p{
      text-align:center;
      color:#ddd;
    }

    .modal-content input,
    .modal-content textarea,
    .modal-content select{
      width:100%;
      padding:14px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      background:#2a004d;
      color:white;
      font-size:1rem;
    }

    .upload-actions{
      margin-top:20px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    /* DELETE BUTTON */

    .delete-btn{
      margin-top:15px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#ff0033;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .delete-btn:hover{
      background:#ff3355;
    }

    /* LOADER */

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:99999;
    }

    .loader{
      width:80px;
      height:80px;
      border:7px solid #333;
      border-top:7px solid #00ffff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .loader-text{
      margin-top:20px;
      color:#00ffff;
      font-size:1.3rem;
      font-weight:bold;
    }

    @media(max-width:768px){

  h1{
    font-size:3rem;
  }

  .header-buttons{
    position:static;
    justify-content:center;
    margin-top:20px;
  }

}


  </style>
</head>
<body>

  <header>

    <h1>AUREX</h1>

    <div class="header-buttons">

      <button id="loginBtn">
        LOGIN
      </button>

      <button id="uploadBtn" style="display:none;">
        UPLOAD NFT
      </button>

    </div>

  </header>

  <!-- NAVIGATION -->

  <nav class="nav">

    <button class="nav-btn active" id="relicsBtn">
      RELICS
    </button>

    <button class="nav-btn" id="totemsBtn">
      TOTEMS
    </button>

  </nav>

  <!-- RELICS -->

  <section id="relics-section" class="section active">

    <div class="legendary-banner">
      ALL RELICS ARE LEGENDARY
    </div>

    <div class="gallery" id="relics-gallery"></div>

  </section>

  <!-- TOTEMS -->

  <section id="totems-section" class="section">

    <div style="text-align:center;padding:20px;">

      <button class="nav-btn active" id="bestBtn">
        BEST
      </button>

      <button class="nav-btn" id="legendaryBtn">
        LEGENDARY
      </button>

    </div>

    <div class="gallery" id="totems-gallery"></div>

  </section>

  <!-- UPLOAD MODAL -->

  <div class="modal" id="uploadModal">

    <div class="modal-content">

      <span class="close" id="closeUpload">
        &times;
      </span>

      <h2>Upload NFT</h2>

      <input type="text" id="nftName" placeholder="NFT Name"/>

      <textarea id="nftDesc" rows="4" placeholder="Description"></textarea>

      <select id="nftSection">

        <option value="relics">
          Relics
        </option>

        <option value="totems">
          Totems
        </option>

      </select>

      <select id="totemType" style="display:none;">

        <option value="best">
          Best
        </option>

        <option value="legendary">
          Legendary
        </option>

      </select>

      <input type="file" id="imageUpload" accept="image/*" multiple/>

      <div class="upload-actions">

        <button onclick="uploadNFTs()">
          UPLOAD
        </button>

        <button onclick="closeUploadModal()">
          CANCEL
        </button>

      </div>

    </div>

  </div>

  <!-- PREVIEW MODAL -->

  <div class="modal" id="previewModal">

  <div class="modal-content">

    <span class="close" id="closePreview">
      &times;
    </span>

    <h2 id="modalTitle"></h2>

    <p id="modalDesc"></p>

    <!-- ADMIN EDIT -->

    <textarea
      id="editDesc"
      style="
      display:none;
      margin-top:20px;
      "
      rows="5"></textarea>

    <button
      id="saveDescBtn"
      style="
      display:none;
      margin-top:15px;
      ">
      SAVE DESCRIPTION
    </button>

  </div>

</div>

  <!-- LOADER -->

  <div class="loader-overlay" id="loader">

    <div class="loader"></div>

    <div class="loader-text" id="loaderText">
      Uploading NFT...
    </div>

  </div>

  <script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
      "https://svlhichdvqkjqdyxposi.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    // =========================
    // DATA
    // =========================

    let relicsData = [];

    let totemsBestData = [];

    let totemsLegendaryData = [];

    let isLoggedIn = false;

    let currentNFT = null;

document.getElementById("saveDescBtn")
.addEventListener("click", async ()=>{

  const newDesc =
    document.getElementById("editDesc")
    .value.trim();

  if(!currentNFT) return;

  const { error } =
    await supabaseClient
    .from("nfts_data")
    .update({
      description: newDesc
    })
    .eq("id", currentNFT.id);

  if(error){
    console.log(error);
    alert("Update Failed");
    return;
  }

  alert("Description Updated");

  currentNFT.desc = newDesc;

  document.getElementById("modalDesc")
  .innerText = newDesc;

  await loadNFTs();

});
    
    async function loadNFTs(){

  const { data, error } =
    await supabaseClient
    .from("nfts_data")
    .select("*")
    .order("id",{ ascending:false });

  if(error){
    console.log(error);
    return;
  }

  relicsData = [];
  totemsBestData = [];
  totemsLegendaryData = [];

  data.forEach((item)=>{

    const nft = {

      id:item.id,
      title:item.title,
      desc:item.description,
      img:item.img,
      section:item.section,
      type:item.type

    };

    // RELICS
    if(item.section === "relics"){

      relicsData.push(nft);

    }

    // TOTEMS
    else if(item.section === "totems"){

      if(item.type === "best"){

        totemsBestData.push(nft);

      }

      else if(item.type === "legendary"){

        totemsLegendaryData.push(nft);

      }

    }

  });

  renderGallery(
    "relics-gallery",
    relicsData
  );

  // DEFAULT
  renderGallery(
    "totems-gallery",
    totemsBestData
  );

}
    // =========================
    // RENDER GALLERY
    // =========================

    function renderGallery(containerId, data){

  const container = document.getElementById(containerId);
  container.innerHTML = "";

  if(data.length === 0){
    container.innerHTML = "<h2 style='text-align:center;width:100%;'>No NFTs Yet</h2>";
    return;
  }

  data.forEach((item, index)=>{

    const card = document.createElement("div");
    card.className = "nft-card";

    card.innerHTML = `
      <img src="${item.img}" alt="${item.title}">

      <div class="card-content">
        <h3>${item.title}</h3>
        <p>${item.desc}</p>

        ${isLoggedIn ? `
          <button class="delete-btn"
            onclick="deleteNFT('${containerId}', ${index})">
            DELETE NFT
          </button>
        ` : ""}
      </div>
    `;

    card.querySelector("img").onclick = () => {
      openPreview(item);
    };

    container.appendChild(card);
  });
}

    // =========================
    // PREVIEW
    // =========================


function openPreview(item){

  currentNFT = item;

  document.getElementById("previewModal")
  .style.display = "flex";

  document.getElementById("modalTitle")
  .innerText = item.title;

  document.getElementById("modalDesc")
  .innerText = item.desc;

  // ADMIN CONTROLS

  if(isLoggedIn){

    document.getElementById("editDesc")
    .style.display = "block";

    document.getElementById("saveDescBtn")
    .style.display = "block";

    document.getElementById("editDesc")
    .value = item.desc;

  }

  else{

    document.getElementById("editDesc")
    .style.display = "none";

    document.getElementById("saveDescBtn")
    .style.display = "none";

  }

}

    function closePreview(){

      document.getElementById("previewModal")
      .style.display = "none";

    }

    // =========================
    // CLOSE UPLOAD
    // =========================

    function closeUploadModal(){

      document.getElementById("uploadModal")
      .style.display = "none";

    }

    // =========================
    // DELETE NFT
    // =========================

   async function deleteNFT(containerId,index){

  const confirmDelete =
    confirm("Delete this NFT permanently?");

  if(!confirmDelete) return;

  let nft;

  // FIND NFT
  if(containerId === "relics-gallery"){

    nft = relicsData[index];

  }else{

    if(
      document.getElementById("bestBtn")
      .classList.contains("active")
    ){

      nft = totemsBestData[index];

    }else{

      nft = totemsLegendaryData[index];

    }

  }

  try{

    // DELETE FROM DATABASE
    const { error } =
      await supabaseClient
      .from("nfts_data")
      .delete()
      .eq("id",nft.id);

    if(error){

      console.log(error);
      alert("Delete Failed");
      return;

    }

    // REMOVE FROM STORAGE ALSO

const imagePath =
  decodeURIComponent(
    nft.img.split("/nfts/")[1]
  );

console.log("Deleting Storage Path:", imagePath);

if(imagePath){

  const { error:storageError } =
    await supabaseClient
    .storage
    .from("nfts")
    .remove([imagePath]);

  if(storageError){

    console.log(storageError);

  }

}

    // RELOAD
    await loadNFTs();

  }catch(err){

    console.log(err);
    alert("Delete Failed");

  }

}

    // =========================
    // UPLOAD NFT
    // =========================

    async function uploadNFTs(){

      const files =
        document.getElementById("imageUpload").files;

      if(files.length === 0){

        alert("Select image first");

        return;
      }

      document.getElementById("loader")
      .style.display = "flex";

      const section =
        document.getElementById("nftSection").value;

      const totemType =
        document.getElementById("totemType").value;

      const title =
        document.getElementById("nftName").value.trim()
        || "Untitled NFT";

      const desc =
        document.getElementById("nftDesc").value.trim()
        || "No description";

      let uploadedCount = 0;

      for(let file of files){

        try{

          const fileExt =
            file.name.split(".").pop();

          const fileName =
            `${Date.now()}-${Math.random()
            .toString(36)
            .substring(2)}.${fileExt}`;

          const path =
            `${section}/${fileName}`;

          const { error } =
            await supabaseClient.storage
            .from("nfts")
            .upload(path,file,{
              cacheControl:"1",
              upsert:true
            });

          if(error){

            console.log(error);

            alert(error.message);

            continue;
          }

          const { data:urlData } =
            supabaseClient.storage
            .from("nfts")
            .getPublicUrl(path);

          const { error: insertError } =
await supabaseClient
.from("nfts_data")
.insert([{

  title:title,
  description:desc,
  img:urlData.publicUrl,
  section:section,
  type:totemType

}]);

if(insertError){

  console.log(insertError);

  alert(insertError.message);

  continue;

}

          uploadedCount++;

        }catch(err){

          console.log(err);

          alert(err.message);

        }

      }

      if(uploadedCount > 0){

        document.getElementById("loaderText")
        .innerText =
          uploadedCount +
          " NFT Uploaded Successfully";

      }else{

        document.getElementById("loaderText")
        .innerText =
          "Upload Failed";

      }

      refreshGallery();

      await loadNFTs();

      setTimeout(()=>{

        document.getElementById("loader")
        .style.display = "none";

        document.getElementById("loaderText")
        .innerText =
          "Uploading NFT...";

        closeUploadModal();

      },1500);

    }

    // =========================
    // REFRESH
    // =========================

    function refreshGallery(){

      if(
        document.getElementById("relics-section")
        .classList.contains("active")
      ){

        renderGallery(
          "relics-gallery",
          relicsData
        );

      }else{

        if(
          document.getElementById("bestBtn")
          .classList.contains("active")
        ){

          renderGallery(
            "totems-gallery",
            totemsBestData
          );

        }else{

          renderGallery(
            "totems-gallery",
            totemsLegendaryData
          );

        }

      }

    }

// =========================
// LOGIN
// =========================

document.getElementById("loginBtn")
.addEventListener("click",()=>{

  if(isLoggedIn){

    isLoggedIn = false;

    document.getElementById("loginBtn")
    .innerText = "LOGIN";

    document.getElementById("uploadBtn")
    .style.display = "none";

    refreshGallery();

    alert("Logged Out");

    return;

  }

  const secretWord =
    prompt("Enter Secret Word");

  if(
    secretWord === "tmkc"
    ||
    secretWord === "Tmkc"
  ){

    isLoggedIn = true;

    document.getElementById("loginBtn")
    .innerText = "LOGOUT";

    document.getElementById("uploadBtn")
    .style.display = "block";

    refreshGallery();

    alert("Login Successful");

  }else{

    alert("Wrong Secret Word");

  }

});

    // =========================
    // OPEN UPLOAD
    // =========================

    document.getElementById("uploadBtn")
    .addEventListener("click",()=>{

      document.getElementById("uploadModal")
      .style.display = "flex";

    });

    // =========================
    // NFT SECTION SELECT
    // =========================

    document.getElementById("nftSection")
    .addEventListener("change",function(){

      document.getElementById("totemType")
      .style.display =
        this.value === "totems"
        ? "block"
        : "none";

    });

    // =========================
    // NAVIGATION
    // =========================

    document.getElementById("relicsBtn")
    .addEventListener("click",()=>{

      document.getElementById("relics-section")
      .classList.add("active");

      document.getElementById("totems-section")
      .classList.remove("active");

      document.getElementById("relicsBtn")
      .classList.add("active");

      document.getElementById("totemsBtn")
      .classList.remove("active");

      renderGallery(
        "relics-gallery",
        relicsData
      );

    });

    document.getElementById("totemsBtn")
    .addEventListener("click",()=>{

      document.getElementById("totems-section")
      .classList.add("active");

      document.getElementById("relics-section")
      .classList.remove("active");

      document.getElementById("totemsBtn")
      .classList.add("active");

      document.getElementById("relicsBtn")
      .classList.remove("active");

      renderGallery(
        "totems-gallery",
        totemsBestData
      );

    });

    // =========================
    // TOTEM FILTERS
    // =========================

    document.getElementById("bestBtn")
    .addEventListener("click",()=>{

      document.getElementById("bestBtn")
      .classList.add("active");

      document.getElementById("legendaryBtn")
      .classList.remove("active");

      renderGallery(
        "totems-gallery",
        totemsBestData
      );

    });

    document.getElementById("legendaryBtn")
    .addEventListener("click",()=>{

      document.getElementById("legendaryBtn")
      .classList.add("active");

      document.getElementById("bestBtn")
      .classList.remove("active");

      renderGallery(
        "totems-gallery",
        totemsLegendaryData
      );

    });

    // =========================
    // CLOSE MODALS
    // =========================

    document.getElementById("closePreview")
    .onclick = closePreview;

    document.getElementById("closeUpload")
    .onclick = closeUploadModal;

    window.onclick = (e)=>{

      if(e.target.id === "previewModal"){

        closePreview();

      }

      if(e.target.id === "uploadModal"){

        closeUploadModal();

      }

    };

    // =========================
    // INITIAL LOAD
    // =========================

    loadNFTs();

  </script>

</body>
</html>
