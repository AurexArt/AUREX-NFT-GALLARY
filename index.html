<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:#0a001f; color:white; font-family:Arial,sans-serif; overflow-x:hidden; }

    header{ text-align:center; padding:60px 20px 20px; position:relative; }
    h1{ font-size:5rem; color:#ff00ff; text-shadow:0 0 25px #ff00ff; margin-bottom:15px; }

    .header-buttons{ position:absolute; top:20px; right:20px; display:flex; gap:12px; }

    button{
      padding:12px 28px; background:transparent; border:2px solid #00ffff;
      color:#00ffff; border-radius:50px; cursor:pointer; font-weight:bold; transition:0.3s;
    }
    button:hover{ background:#00ffff; color:black; transform:scale(1.05); }

    .nav{ display:flex; justify-content:center; gap:20px; padding:20px; background:#140029; flex-wrap:wrap; }
    .nav-btn.active{ background:#ff00ff; border-color:#ff00ff; color:black; }

    .section{ display:none; }
    .section.active{ display:block; }

    .legendary-banner{
      max-width:900px; margin:25px auto; padding:20px; text-align:center;
      font-size:1.5rem; font-weight:bold; border-radius:15px; color:black;
      background:linear-gradient(45deg,#ffd700,#ffaa00); box-shadow:0 0 25px gold;
    }

    .gallery{
      width:100%; padding:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    }
    .nft-card{
      background:#1d0037; border-radius:10px; overflow:hidden; border:1px solid #440066;
    }
    .nft-card img{
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block; cursor:pointer;
    }

    @media(min-width:768px){ .gallery{ grid-template-columns:repeat(5,1fr); gap:10px; } }
    @media(min-width:1024px){ .gallery{ grid-template-columns:repeat(6,1fr); gap:15px; padding:20px; } }

    .modal{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
      z-index:1000; justify-content:center; align-items:center; padding:20px;
    }

    .modal-content{
      background:#1a0033; width:100%; max-width:520px; border-radius:24px;
      padding:30px; position:relative; border:3px solid #ff00ff;
      box-shadow:0 0 40px rgba(255, 0, 255, 0.5);
    }

    .close{
      position:absolute; top:15px; right:20px; font-size:42px;
      cursor:pointer; color:#ff00ff;
    }
    .close:hover{ color:#ff66ff; }

    .modal-content h2{
      text-align:center; color:#ff00ff; margin-bottom:25px; font-size:1.9rem;
    }

    .modal-content input[type="file"]{
      width:100%; padding:12px; background:#2a004d; border-radius:12px; color:white;
    }

    .modal-content select{
      width:100%; padding:14px; margin:12px 0; background:#2a004d;
      border:none; border-radius:12px; color:white;
    }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS</button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <section id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </section>

  <section id="totems-section" class="section">
    <div style="text-align:center;padding:20px;">
      <button class="nav-btn active" id="bestBtn">BEST</button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </section>

  <!-- SIMPLE UPLOAD MODAL -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2>✦ UPLOAD NFT ✦</h2>
      
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      
      <select id="nftSection">
        <option value="relics">Relics</option>
        <option value="totems">Totems</option>
      </select>
      
      <select id="totemType" style="display:none;">
        <option value="best">Best</option>
        <option value="legendary">Legendary</option>
      </select>
      
      <div style="margin-top:30px; text-align:center;">
        <button onclick="uploadNFTs()">UPLOAD NOW</button>
        <button onclick="closeUploadModal()">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- SIMPLE IMAGE PREVIEW -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" id="closePreview">&times;</span>
      <img id="modalImage" src="" alt="NFT">
    </div>
  </div>

  <!-- LOADER -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Uploading NFT...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [];
    let totemsBestData = [];
    let totemsLegendaryData = [];
    let isLoggedIn = false;

    async function loadNFTs(){
      const { data } = await supabaseClient.from("nfts_data").select("*").order("id", { ascending: false });

      relicsData = [];
      totemsBestData = [];
      totemsLegendaryData = [];

      data.forEach(item => {
        const nft = { id: item.id, img: item.img, section: item.section, type: item.type };
        if (item.section === "relics") relicsData.push(nft);
        else if (item.section === "totems") {
          if (item.type === "best") totemsBestData.push(nft);
          else if (item.type === "legendary") totemsLegendaryData.push(nft);
        }
      });

      renderGallery("relics-gallery", relicsData);
      renderGallery("totems-gallery", totemsBestData);
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = "<h2 style='text-align:center;width:100%;padding:40px;'>No NFTs Yet</h2>";
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.innerHTML = `<img src="${item.img}" alt="NFT">`;

        if(isLoggedIn){
          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerText = "DELETE";
          delBtn.onclick = () => deleteNFT(item.id);
          card.appendChild(delBtn);
        }

        card.querySelector("img").onclick = () => {
          document.getElementById("modalImage").src = item.img;
          document.getElementById("previewModal").style.display = "flex";
        };
        container.appendChild(card);
      });
    }

    async function deleteNFT(id){
      if(!confirm("Delete this NFT?")) return;
      await supabaseClient.from("nfts_data").delete().eq("id", id);
      await loadNFTs();
    }

    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select image(s)");

      document.getElementById("loader").style.display = "flex";

      const section = document.getElementById("nftSection").value;
      const totemType = document.getElementById("totemType").value;

      let count = 0;

      for(let file of files){
        try{
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${section}/${fileName}`;

          await supabaseClient.storage.from("nfts").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("nfts").getPublicUrl(path);

          await supabaseClient.from("nfts_data").insert([{
            title: "Untitled",
            description: "",
            img: urlData.publicUrl,
            section: section,
            type: totemType || null
          }]);
          count++;
        } catch(e){ console.log(e); }
      }

      document.getElementById("loaderText").innerText = `${count} NFT(s) Uploaded`;
      await loadNFTs();

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        closeUploadModal();
      }, 1500);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
    }

    // Login
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        loadNFTs();
        alert("Logged Out");
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        loadNFTs();
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });

    // Event Listeners
    document.getElementById("uploadBtn").addEventListener("click", () => {
      document.getElementById("uploadModal").style.display = "flex";
    });

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
      renderGallery("relics-gallery", relicsData);
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("bestBtn").addEventListener("click", () => {
      document.getElementById("bestBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsBestData);
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
      document.getElementById("legendaryBtn").classList.add("active");
      document.getElementById("bestBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsLegendaryData);
    });

    loadNFTs();
  </script>
</body>
</html>
