<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ 
      background: #000000; 
      color: #ffffff; 
      font-family:Arial,sans-serif; 
      overflow-x:hidden; 
    }

    header{ 
      text-align:center; 
      padding:80px 20px 30px; 
      position:relative; 
    }
    
    h1{ 
      font-size:5.2rem; 
      color:#ffaa00; 
      font-weight:400; 
      letter-spacing:8px; 
      font-family: 'Georgia', serif;
      text-transform: uppercase;
    }

    .header-buttons{ 
      position:absolute; 
      top:20px; 
      right:20px; 
      display:flex; 
      gap:12px; 
    }

    button{
      padding:12px 26px; 
      background:transparent; 
      border:2px solid; 
      border-radius:50px; 
      cursor:pointer; 
      font-weight:bold; 
      transition:0.3s;
    }
    button:hover{ 
      transform:scale(1.05); 
    }

    #loginBtn { border-color: #ffd700; color: #ffd700; }
    #uploadBtn { border-color: #ffaa00; color: #ffaa00; }
    #deleteModeBtn { border-color: #ff6600; color: #ff6600; }

    .nav-btn { border-color: #ffbb33; color: #ffbb33; }
    .nav-btn.active, .nav-btn:hover { 
      border-color: #ffdd77; color: #ffdd77; 
    }

    .nav{ 
      display:flex; 
      justify-content:center; 
      gap:20px; 
      padding:20px; 
      background:#0a0a0a; 
    }

    .modal{
      display:none; 
      position:fixed; 
      inset:0; 
      background:rgba(0,0,0,0.97);
      z-index:1000; 
      justify-content:center; 
      align-items:center; 
      padding:15px;
    }

    .modal-content{
      background:#1a1a1a; 
      width:100%; 
      max-width:600px; 
      padding:40px 30px; 
      border-radius:20px;
      border: 2px solid #ff8800;
    }

    .close{
      position:absolute; 
      top:15px; 
      right:25px; 
      font-size:38px;
      cursor:pointer; 
      color:#ffaa00;
    }

    input[type="file"], select{
      width:100%;
      padding:14px;
      background:#111;
      border:2px dashed #ff8800;
      border-radius:12px;
      color:#fff;
      margin:15px 0;
    }

    .upload-btn{
      background:#ff8800;
      color: white;
      border: none;
      padding:14px 40px;
    }
    .cancel-btn{
      background:transparent;
      border:2px solid #ffcc66;
      color: #ffcc66;
      padding:14px 40px;
    }

    .bulk-delete-bar {
      position: sticky;
      top: 0;
      background: #0a0a0a;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #ff6600;
      display: none;
      z-index: 100;
    }

    .gallery{
      width:100%; 
      padding:15px; 
      display:grid; 
      grid-template-columns:repeat(3,1fr); 
      gap:12px;
    }
    .nft-card{
      background:#111; 
      border-radius:12px; 
      overflow:hidden; 
      border:1px solid #444;
      position:relative;
    }
    .nft-card img{
      width:100%; 
      aspect-ratio:1/1; 
      object-fit:cover; 
      cursor:pointer;
    }

    .select-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      z-index: 10;
      accent-color: #ffaa00;
      display: none;
    }
    .delete-mode .select-checkbox { display: block; }

    @media(min-width:768px){ .gallery{ grid-template-columns:repeat(5,1fr); } }
    @media(min-width:1024px){ .gallery{ grid-template-columns:repeat(6,1fr); } }

    .loader-overlay{
      position:fixed; 
      inset:0; 
      background:rgba(0,0,0,0.95);
      display:none; 
      justify-content:center; 
      align-items:center;
      flex-direction:column; 
      z-index:99999;
    }
    .loader{
      width:80px; height:80px; 
      border:7px solid #333;
      border-top:7px solid #ffaa00; 
      border-radius:50%; 
      animation:spin 1s linear infinite;
    }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
      <button id="deleteModeBtn" style="display:none;">🗑️</button>
    </div>
  </header>

  <div class="bulk-delete-bar" id="bulkDeleteBar">
    <span id="selectedCount" style="color:#ffdd88; margin-right:20px;">0 Selected</span>
    <button onclick="deleteSelectedNFTs()">DELETE SELECTED</button>
    <button onclick="exitDeleteMode()">CANCEL</button>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS <span id="relicsCount">(0)</span></button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <section id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </section>

  <section id="totems-section" class="section">
    <div style="text-align:center;padding:25px;">
      <button class="nav-btn active" id="bestBtn">BEST <span id="bestCount">(0)</span></button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY <span id="legendaryCount">(0)</span></button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </section>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2 style="color:#ffaa00; text-align:center; margin-bottom:25px;">✦ UPLOAD NEW NFT ✦</h2>
      
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      <select id="nftSection">
        <option value="relics">Relics</option>
        <option value="totems">Totems</option>
      </select>
      <select id="totemType" style="display:none;">
        <option value="best">Best</option>
        <option value="legendary">Legendary</option>
      </select>

      <div style="margin-top:30px; text-align:center;">
        <button class="upload-btn" onclick="uploadNFTs()">UPLOAD NOW</button>
        <button class="cancel-btn" onclick="closeUploadModal()">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" id="closePreview">&times;</span>
      <img id="modalImage" src="" alt="NFT Image">
    </div>
  </div>

  <!-- Loader -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Uploading...</div>
    <div class="progress-text" id="progressText">0/0</div>
  </div>

  <script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [], totemsBestData = [], totemsLegendaryData = [];
    let isLoggedIn = false;
    let deleteMode = false;
    let selectedNFTs = new Set();

    async function loadNFTs(){
      const { data } = await supabaseClient.from("nfts_data").select("*").order("id", { ascending: false });

      relicsData = []; totemsBestData = []; totemsLegendaryData = [];

      data.forEach(item => {
        const nft = { id: item.id, img: item.img, section: item.section, type: item.type };
        if (item.section === "relics") relicsData.push(nft);
        else if (item.section === "totems") {
          if (item.type === "best") totemsBestData.push(nft);
          else if (item.type === "legendary") totemsLegendaryData.push(nft);
        }
      });

      updateCounts();
      renderCurrentGallery();
    }

    function updateCounts(){
      document.getElementById("relicsCount").innerText = `(${relicsData.length})`;
      document.getElementById("bestCount").innerText = `(${totemsBestData.length})`;
      document.getElementById("legendaryCount").innerText = `(${totemsLegendaryData.length})`;
    }

    function renderCurrentGallery(){
      if (document.getElementById("relics-section").classList.contains("active")) {
        renderGallery("relics-gallery", relicsData);
      } else {
        const isBest = document.getElementById("bestBtn").classList.contains("active");
        renderGallery("totems-gallery", isBest ? totemsBestData : totemsLegendaryData);
      }
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = `<h2 style='text-align:center;padding:60px;color:#ffaa00;'>No NFTs Yet</h2>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.innerHTML = `
          <input type="checkbox" class="select-checkbox" data-id="${item.id}">
          <img src="${item.img}" alt="NFT">
        `;

        card.querySelector(".select-checkbox").addEventListener("change", (e) => {
          if(e.target.checked) selectedNFTs.add(item.id);
          else selectedNFTs.delete(item.id);
          document.getElementById("selectedCount").innerText = `${selectedNFTs.size} Selected`;
        });

        card.querySelector("img").onclick = () => {
          if(!deleteMode){
            document.getElementById("modalImage").src = item.img;
            document.getElementById("previewModal").style.display = "flex";
          }
        };
        container.appendChild(card);
      });
    }

    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select images!");

      document.getElementById("loader").style.display = "flex";
      document.getElementById("loaderText").innerText = "Uploading NFTs...";
      document.getElementById("progressText").innerText = `0/${files.length}`;

      const section = document.getElementById("nftSection").value;
      const type = document.getElementById("totemType").value || null;

      let count = 0;

      for(let file of files){
        try {
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${section}/${fileName}`;

          await supabaseClient.storage.from("nfts").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("nfts").getPublicUrl(path);

          await supabaseClient.from("nfts_data").insert([{
            img: urlData.publicUrl,
            section: section,
            type: type
          }]);

          count++;
          document.getElementById("progressText").innerText = `${count}/${files.length}`;
        } catch(e){ console.error(e); }
      }

      document.getElementById("loaderText").innerText = "✅ Upload Complete!";

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        closeUploadModal();
        loadNFTs();
      }, 1600);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
      document.getElementById("imageUpload").value = "";
    }

    function enterDeleteMode(){
      deleteMode = true;
      document.body.classList.add("delete-mode");
      document.getElementById("bulkDeleteBar").style.display = "block";
      renderCurrentGallery();
    }

    function exitDeleteMode(){
      deleteMode = false;
      selectedNFTs.clear();
      document.body.classList.remove("delete-mode");
      document.getElementById("bulkDeleteBar").style.display = "none";
      renderCurrentGallery();
    }

    // ====================== EVENT LISTENERS ======================
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("deleteModeBtn").style.display = "none";
        exitDeleteMode();
        alert("Logged Out");
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        document.getElementById("deleteModeBtn").style.display = "block";
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });

    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");
    document.getElementById("deleteModeBtn").addEventListener("click", () => deleteMode ? exitDeleteMode() : enterDeleteMode());

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
      renderCurrentGallery();
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
      renderCurrentGallery();
    });

    document.getElementById("bestBtn").addEventListener("click", () => {
      document.getElementById("bestBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderCurrentGallery();
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
      document.getElementById("legendaryBtn").classList.add("active");
      document.getElementById("bestBtn").classList.remove("active");
      renderCurrentGallery();
    });

    loadNFTs();
  </script>
</body>
</html>
