<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUREX | Relics & Totems</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a001f;color:white;font-family:Arial;}

header{text-align:center;padding:60px 20px;position:relative;}
h1{font-size:5rem;color:#ff00ff;text-shadow:0 0 25px #ff00ff;}

.header-buttons{position:absolute;top:20px;right:20px;display:flex;gap:12px;}

button{
padding:12px 25px;
border:2px solid #00ffff;
background:transparent;
color:#00ffff;
border-radius:50px;
cursor:pointer;
font-weight:bold;
}

button:hover{background:#00ffff;color:black;}

.nav{display:flex;justify-content:center;gap:20px;padding:15px;background:#140029;}

.nav-btn.active{background:#ff00ff;color:black;}

.section{display:none;}
.section.active{display:block;}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
padding:8px;
}

@media(min-width:768px){.gallery{grid-template-columns:repeat(5,1fr);}}
@media(min-width:1024px){.gallery{grid-template-columns:repeat(6,1fr);}}

.nft-card{
background:#1d0037;
border-radius:10px;
overflow:hidden;
border:1px solid #440066;
}

.nft-card img{width:100%;aspect-ratio:1/1;object-fit:cover;}

.card-title{
font-size:0.7rem;
text-align:center;
color:#ff00ff;
padding:3px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.modal-content{
background:#1a0033;
padding:20px;
width:90%;
max-width:500px;
border-radius:15px;
border:2px solid #ff00ff;
position:relative;
}

.close{position:absolute;right:15px;top:10px;font-size:30px;cursor:pointer;color:#ff00ff;}

input,textarea{
width:100%;
margin-top:10px;
padding:10px;
background:#2a004d;
border:none;
color:white;
border-radius:8px;
}

.delete-btn{
margin-top:10px;
width:100%;
background:#ff0033;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>AUREX</h1>

<div class="header-buttons">
<button id="loginBtn">LOGIN</button>
<button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
</div>
</header>

<nav class="nav">
<button class="nav-btn active" id="relicsBtn">RELICS</button>
<button class="nav-btn" id="totemsBtn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
<div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
<div class="gallery" id="totems-gallery"></div>
</section>

<!-- UPLOAD -->
<div class="modal" id="uploadModal">
<div class="modal-content">
<span class="close" onclick="closeUploadModal()">&times;</span>

<h3>Upload NFT</h3>

<input id="nftName" placeholder="Name"/>
<textarea id="nftDesc" placeholder="Description"></textarea>

<input type="file" id="imageUpload" multiple/>

<button onclick="uploadNFTs()">UPLOAD</button>
</div>
</div>

<!-- PREVIEW -->
<div class="modal" id="previewModal">
<div class="modal-content">
<span class="close" onclick="closePreview()">&times;</span>

<h3>Edit NFT</h3>

<input id="editTitle" placeholder="Title"/>
<textarea id="editDesc"></textarea>

<button id="saveBtn">SAVE</button>

</div>
</div>

<script>
const supabase = window.supabase.createClient(
"https://svlhichdvqkjqdyxposi.supabase.co",
"YOUR-KEY"
);

let dataStore=[];
let currentNFT=null;
let isLoggedIn=false;

async function loadNFTs(){
const {data}=await supabase.from("nfts_data").select("*").order("id",{ascending:false});
dataStore=data;

render("relics-gallery","relics");
render("totems-gallery","totems");
}

function render(id,section){
const el=document.getElementById(id);
el.innerHTML="";

dataStore.filter(x=>x.section===section).forEach(item=>{

const div=document.createElement("div");
div.className="nft-card";

div.innerHTML=`
<img src="${item.img}">
<div class="card-title">${item.title}</div>
`;

div.onclick=()=>open(item);

el.appendChild(div);
});
}

function open(item){
currentNFT=item;

document.getElementById("previewModal").style.display="flex";

document.getElementById("editTitle").value=item.title;
document.getElementById("editDesc").value=item.description;
}

document.getElementById("saveBtn").onclick=async()=>{

const title=document.getElementById("editTitle").value;
const desc=document.getElementById("editDesc").value;

await supabase.from("nfts_data")
.update({title:title,description:desc})
.eq("id",currentNFT.id);

closePreview();
loadNFTs();
};

function closePreview(){
document.getElementById("previewModal").style.display="none";
}

function closeUploadModal(){
document.getElementById("uploadModal").style.display="none";
}

async function uploadNFTs(){

const file=document.getElementById("imageUpload").files[0];
const name=document.getElementById("nftName").value;
const desc=document.getElementById("nftDesc").value;

const path="nfts/"+Date.now()+file.name;

await supabase.storage.from("nfts").upload(path,file);

const url=supabase.storage.from("nfts").getPublicUrl(path).data.publicUrl;

await supabase.from("nfts_data").insert([{
title:name,
description:desc,
img:url,
section:"relics"
}]);

loadNFTs();
}

document.getElementById("loginBtn").onclick=()=>{
const pass=prompt("Enter Secret");
if(pass==="tmkc"||pass==="Tmkc"){
isLoggedIn=true;
document.getElementById("uploadBtn").style.display="block";
alert("Login success");
}
};

document.getElementById("uploadBtn").onclick=()=>{
document.getElementById("uploadModal").style.display="flex";
};

document.getElementById("relicsBtn").onclick=()=>render("relics-gallery","relics");
document.getElementById("totemsBtn").onclick=()=>render("totems-gallery","totems");

loadNFTs();
</script>

</body>
</html>
