<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREX | Relics & Totems</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #0a001f;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 60px 20px 30px;
      position: relative;
    }
    h1 {
      font-size: 5.5rem;
      color: #ff00ff;
      text-shadow: 0 0 30px #ff00ff;
    }
    .login-btn {
      position: absolute;
      top: 30px;
      right: 30px;
      padding: 12px 25px;
      background: transparent;
      color: #00ffff;
      border: 2px solid #00ffff;
      border-radius: 50px;
      cursor: pointer;
    }
    .nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      background: #1a0033;
    }
    .nav-btn {
      padding: 12px 35px;
      font-size: 1.2rem;
      background: transparent;
      color: white;
      border: 2px solid #ff00ff;
      border-radius: 50px;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #ff00ff;
      color: black;
    }
    .section { display: none; }
    .section.active { display: block; }
    .legendary-banner {
      padding: 20px;
      background: linear-gradient(#ffd700, #ff8800);
      color: black;
      font-size: 1.8rem;
      margin: 20px auto;
      max-width: 900px;
      border-radius: 15px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 30px 5%;
    }
    .nft-card {
      background: #1f003d;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
    }
    .nft-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }
    #upload-section {
      display: none;
      text-align: center;
      padding: 30px;
      background: #2a004d;
      margin: 20px 5%;
      border-radius: 15px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1a0033;
      max-width: 700px;
      width: 90%;
      border-radius: 20px;
      overflow: hidden;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 40px;
      color: #ff00ff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <button class="login-btn" id="loginBtn">LOGIN</button>
  </header>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS</button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <!-- Relics Section -->
  <div id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </div>

  <!-- Totems Section -->
  <div id="totems-section" class="section">
    <div class="nav" style="background:none; padding:15px;">
      <button class="nav-btn active" id="bestBtn">BEST</button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </div>

  <!-- Upload Section -->
  <div id="upload-section">
    <h2>Upload New NFT</h2>
    <input type="file" id="imageUpload" accept="image/*"><br><br>
    <select id="nftType">
      <option value="relics">Relics</option>
      <option value="totems-best">Totems - Best</option>
      <option value="totems-legendary">Totems - Legendary</option>
    </select><br><br>
    <button onclick="uploadImage()">Upload Image</button>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <img id="modalImage" src="" alt="" style="width:100%;">
      <div style="padding:20px; text-align:center;">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://svlhichdvqkjqdyxposi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM';

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let isLoggedIn = false;

    // Sample Data
    const relicsData = [
      { title: "Ancient Sun Relic", img: "https://picsum.photos/id/1015/800/600", desc: "Eternal power of the sun" },
      { title: "Void Crystal Relic", img: "https://picsum.photos/id/201/800/600", desc: "Portal to darkness" }
    ];

    const totemsBestData = [
      { title: "Wolf Spirit Totem", img: "https://picsum.photos/id/251/800/600", desc: "Guardian of the wild" }
    ];

    const totemsLegendaryData = [
      { title: "Phoenix Rebirth", img: "https://picsum.photos/id/866/800/600", desc: "Immortal flame" }
    ];

    function renderGallery(containerId, data) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = "nft-card";
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div class="info">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
        `;
        card.onclick = () => showModal(item);
        container.appendChild(card);
      });
    }

    function showModal(item) {
      document.getElementById('modalImage').src = item.img;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalDesc').textContent = item.desc;
      document.getElementById('modal').style.display = "flex";
    }

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
      if (isLoggedIn) {
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = "LOGIN";
        document.getElementById('upload-section').style.display = 'none';
        return;
      }

      const email = prompt("Enter Email:");
      const password = prompt("Enter Password:");

      if (email === "artaurex@gmail.com" && password === "Artaurex@1233") {
        isLoggedIn = true;
        document.getElementById('loginBtn').textContent = "LOGOUT";
        document.getElementById('upload-section').style.display = 'block';
        alert("Login Successful!");
      } else {
        alert("Wrong Email or Password");
      }
    });

    async function uploadImage() {
      if (!isLoggedIn) return alert("Pehle Login Karo!");
      alert("Upload function ready hai (abhi sample mode mein hai)");
    }

    // Navigation
    document.getElementById('relicsBtn').addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('relicsBtn').classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('relics-section').classList.add('active');
    });

    document.getElementById('totemsBtn').addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('totemsBtn').classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('totems-section').classList.add('active');
    });

    // Modal Close
    document.querySelector('.close').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
    });

    // Initial Load
    window.onload = () => {
      renderGallery('relics-gallery', relicsData);
      renderGallery('totems-gallery', totemsBestData);
    };
  </script>
</body>
</html>
