<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREX | Relics & Totems</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ... same style as before ... */
    body {
      background: #0a001f;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header { text-align: center; padding: 60px 20px 20px; position: relative; }
    h1 { font-size: 5.5rem; color: #ff00ff; text-shadow: 0 0 30px #ff00ff; }
    .header-buttons { position: absolute; top: 30px; right: 30px; display: flex; gap: 12px; }
    button {
      padding: 12px 28px;
      background: transparent;
      color: #00ffff;
      border: 2px solid #00ffff;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #00ffff; color: black; }

    .nav { display: flex; justify-content: center; gap: 30px; padding: 25px; background: #1a0033; }
    .nav-btn {
      padding: 14px 40px;
      font-size: 1.3rem;
      background: transparent;
      color: white;
      border: 2px solid #ff00ff;
      border-radius: 50px;
      cursor: pointer;
    }
    .nav-btn.active { background: #ff00ff; color: black; }

    .section { display: none; }
    .section.active { display: block; }

    .legendary-banner {
      padding: 20px;
      background: linear-gradient(#ffd700, #ffaa00);
      color: black;
      font-size: 1.8rem;
      margin: 20px auto;
      max-width: 900px;
      border-radius: 12px;
      font-weight: bold;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      padding: 30px 5%;
    }

    .nft-card {
      background: #1f003d;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
    }
    .nft-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1a0033;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      border: 2px solid #ff00ff;
    }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #2a004d;
      border: none;
      color: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Same HTML as before (header, nav, sections, modals) -->
  <header>
    <h1>AUREX</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display: none;">UPLOAD NFT</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" id="relicsBtn">RELICS</button>
    <button class="nav-btn" id="totemsBtn">TOTEMS</button>
  </nav>

  <div id="relics-section" class="section active">
    <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
    <div class="gallery" id="relics-gallery"></div>
  </div>

  <div id="totems-section" class="section">
    <div style="text-align:center; padding:20px 0;">
      <button class="nav-btn active" id="bestBtn">BEST</button>
      <button class="nav-btn" id="legendaryBtn">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </div>

  <!-- Upload Modal (same) -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <h2 style="text-align:center; color:#ff00ff;">Upload New NFT</h2>
      
      <input type="text" id="nftName" placeholder="NFT Name">
      <textarea id="nftDesc" rows="3" placeholder="Description"></textarea>
      
      <select id="nftSection">
        <option value="relics">Relics</option>
        <option value="totems">Totems</option>
      </select>
      
      <select id="totemType" style="display:none;">
        <option value="best">Best</option>
        <option value="legendary">Legendary</option>
      </select>

      <input type="file" id="imageUpload" accept="image/*" multiple>

      <div style="margin-top:20px; text-align:center;">
        <button onclick="uploadNFTs()" style="background:#ff00ff; color:black; padding:14px 40px;">UPLOAD</button>
        <button onclick="closeUploadModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal (same) -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <img id="modalImage" src="" alt="" style="width:100%; max-height:550px; object-fit:contain;">
      <div style="padding:20px; text-align:center;">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    // ==================== SUPABASE INITIALIZE ====================
    const supabaseUrl = 'https://svlhichdvqkjqdyxposi.supabase.co';   // ← Yahan apna URL daal
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM';                 // ← Yahan apna Anon Key daal

    const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

    // Data (initial)
    let relicsData = [];
    let totemsBestData = [];
    let totemsLegendaryData = [];

    // Render function
    function renderGallery(containerId, data) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = "nft-card";
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div style="padding:15px; text-align:center;">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
        `;
        card.onclick = () => showModal(item);
        container.appendChild(card);
      });
    }

    function showModal(item) {
      document.getElementById('modalImage').src = item.img;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalDesc').textContent = item.desc;
      document.getElementById('modal').style.display = "flex";
    }

    // ==================== UPLOAD FUNCTION (FIXED) ====================
    async function uploadNFTs() {
      const files = document.getElementById('imageUpload').files;
      if (files.length === 0) return alert("Koi image select karo!");

      const section = document.getElementById('nftSection').value;
      let folder = section;

      if (section === "totems") {
        folder += "-" + document.getElementById('totemType').value;
      }

      let uploadedCount = 0;

      for (let file of files) {
        const fileName = `${Date.now()}-${file.name}`;
        const path = `${folder}/${fileName}`;

        try {
          const { data, error } = await supabase.storage
            .from('nfts')
            .upload(path, file, { upsert: true });

          if (error) throw error;

          // Get public URL
          const { data: urlData } = supabase.storage.from('nfts').getPublicUrl(path);
          
          const newItem = {
            title: document.getElementById('nftName').value || file.name.split('.')[0],
            img: urlData.publicUrl,
            desc: document.getElementById('nftDesc').value || "Uploaded NFT"
          };

          // Add to respective array
          if (section === "relics") {
            relicsData.unshift(newItem);
          } else if (section === "totems") {
            const type = document.getElementById('totemType').value;
            if (type === "best") totemsBestData.unshift(newItem);
            else totemsLegendaryData.unshift(newItem);
          }

          uploadedCount++;
        } catch (err) {
          console.error(err);
          alert("Upload failed for: " + file.name);
        }
      }

      if (uploadedCount > 0) {
        alert(`✅ ${uploadedCount} NFT(s) Uploaded Successfully!`);
        
        // Refresh current visible gallery
        if (document.getElementById('relics-section').classList.contains('active')) {
          renderGallery('relics-gallery', relicsData);
        } else {
          const activeTotem = document.getElementById('bestBtn').classList.contains('active') ? totemsBestData : totemsLegendaryData;
          renderGallery('totems-gallery', activeTotem);
        }
      }

      closeUploadModal();
      // Clear form
      document.getElementById('nftName').value = '';
      document.getElementById('nftDesc').value = '';
      document.getElementById('imageUpload').value = '';
    }

    // Rest of your script (login, navigation, etc.) remains same
    let isLoggedIn = false;
    document.getElementById('loginBtn').addEventListener('click', () => {
      if (isLoggedIn) {
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = "LOGIN";
        document.getElementById('uploadBtn').style.display = "none";
        return;
      }

      const email = prompt("Enter Email:");
      const pass = prompt("Enter Password:");
      if (email === "artaurex@gmail.com" && pass === "Artaurex@1233") {
        isLoggedIn = true;
        document.getElementById('loginBtn').textContent = "LOGOUT";
        document.getElementById('uploadBtn').style.display = "block";
        alert("✅ Login Successful!");
      } else {
        alert("❌ Wrong Email or Password");
      }
    });

    document.getElementById('uploadBtn').addEventListener('click', () => {
      document.getElementById('uploadModal').style.display = "flex";
    });

    function closeUploadModal() {
      document.getElementById('uploadModal').style.display = "none";
    }

    document.getElementById('nftSection').addEventListener('change', function() {
      document.getElementById('totemType').style.display = this.value === 'totems' ? 'block' : 'none';
    });

    // Navigation (same)
    document.getElementById('relicsBtn').addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('relicsBtn').classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('relics-section').classList.add('active');
      renderGallery('relics-gallery', relicsData);
    });

    document.getElementById('totemsBtn').addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('totemsBtn').classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('totems-section').classList.add('active');
      renderGallery('totems-gallery', totemsBestData);
    });

    document.getElementById('bestBtn').addEventListener('click', () => {
      document.getElementById('bestBtn').classList.add('active');
      document.getElementById('legendaryBtn').classList.remove('active');
      renderGallery('totems-gallery', totemsBestData);
    });

    document.getElementById('legendaryBtn').addEventListener('click', () => {
      document.getElementById('legendaryBtn').classList.add('active');
      document.getElementById('bestBtn').classList.remove('active');
      renderGallery('totems-gallery', totemsLegendaryData);
    });

    document.querySelector('.close').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
    });

    // Initial Load
    window.onload = () => {
      // You can keep some demo data or start empty
      renderGallery('relics-gallery', relicsData);
      renderGallery('totems-gallery', totemsBestData);
    };
  </script>
</body>
</html>
