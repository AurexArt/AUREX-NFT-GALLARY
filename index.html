<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ NEW PREMIUM FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1a0033, #050010, #000);
      color:white;
      overflow-x:hidden;
    }

    /* ✨ HERO */
    header{
      text-align:center;
      padding:70px 20px 30px;
      position:relative;
    }

    h1{
      font-family:'Orbitron', sans-serif;
      font-size:5.5rem;
      letter-spacing:3px;
      background: linear-gradient(90deg,#ff00ff,#00ffff,#ffcc00);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:0 0 40px rgba(255,0,255,0.3);
      animation: glow 3s infinite alternate;
    }

    @keyframes glow{
      from{ filter: drop-shadow(0 0 10px #ff00ff); }
      to{ filter: drop-shadow(0 0 25px #00ffff); }
    }

    .header-buttons{
      position:absolute;
      top:25px;
      right:25px;
      display:flex;
      gap:12px;
    }

    /* ✨ BUTTONS */
    button{
      padding:12px 26px;
      background: rgba(255,255,255,0.05);
      border:1px solid rgba(0,255,255,0.4);
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
      font-weight:600;
      backdrop-filter: blur(10px);
      transition:0.3s;
    }

    button:hover{
      background: linear-gradient(90deg,#ff00ff,#00ffff);
      color:black;
      transform:scale(1.08);
      box-shadow:0 0 20px rgba(0,255,255,0.4);
    }

    /* NAV */
    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:18px;
      background:rgba(255,255,255,0.03);
      backdrop-filter: blur(10px);
      border-top:1px solid rgba(255,255,255,0.05);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .nav-btn.active{
      background:linear-gradient(90deg,#ff00ff,#00ffff);
      color:black;
    }

    .section{ display:none; }
    .section.active{ display:block; }

    /* BANNER */
    .legendary-banner{
      max-width:900px;
      margin:30px auto;
      padding:18px;
      text-align:center;
      font-size:1.2rem;
      font-weight:600;
      border-radius:15px;
      color:black;
      background:linear-gradient(90deg,#ffd700,#ff9900);
      box-shadow:0 0 25px rgba(255,200,0,0.4);
    }

    /* GALLERY */
    .gallery{
      width:100%;
      padding:15px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    @media(min-width:768px){
      .gallery{ grid-template-columns:repeat(5,1fr); }
    }

    @media(min-width:1024px){
      .gallery{ grid-template-columns:repeat(6,1fr); }
    }

    /* NFT CARD */
    .nft-card{
      background: rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:16px;
      overflow:hidden;
      transition:0.4s;
      backdrop-filter: blur(10px);
    }

    .nft-card:hover{
      transform:translateY(-8px) scale(1.05);
      border-color:#00ffff;
      box-shadow:0 0 25px rgba(0,255,255,0.3);
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      cursor:pointer;
      transition:0.4s;
    }

    .nft-card:hover img{
      transform:scale(1.08);
    }

    /* MODAL */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      justify-content:center;
      align-items:center;
      z-index:1000;
      padding:20px;
    }

    .modal-content{
      background:rgba(20,0,40,0.9);
      backdrop-filter: blur(15px);
      border:1px solid rgba(255,0,255,0.4);
      padding:25px;
      border-radius:20px;
      max-width:650px;
      width:100%;
      position:relative;
    }

    .close{
      position:absolute;
      top:10px;
      right:15px;
      font-size:30px;
      cursor:pointer;
      color:#ff00ff;
    }

    .modal-content img{
      width:100%;
      border-radius:12px;
      margin-bottom:15px;
      border:1px solid rgba(255,255,255,0.1);
    }

    .delete-btn{
      margin-top:10px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,#ff0033,#ff0066);
      color:white;
      cursor:pointer;
    }

    /* LOADER */
    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:9999;
    }

    .loader{
      width:80px;
      height:80px;
      border:6px solid #222;
      border-top:6px solid #00ffff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{ transform:rotate(360deg); }
    }

    .loader-text{
      margin-top:20px;
      color:#00ffff;
      font-weight:600;
    }
  </style>
</head>

<body>

<header>
  <h1>AUREX</h1>
  <div class="header-buttons">
    <button id="loginBtn">LOGIN</button>
    <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn active" id="relicsBtn">RELICS</button>
  <button class="nav-btn" id="totemsBtn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
  <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
  <div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
  <div class="gallery" id="totems-gallery"></div>
</section>

<!-- MODAL -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <span class="close" id="closePreview">&times;</span>
    <img id="modalImage">
  </div>
</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader"></div>
  <div class="loader-text">Loading...</div>
</div>

<script>
const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let relicsData = [];
let totemsBestData = [];
let totemsLegendaryData = [];
let isLoggedIn = false;

async function loadNFTs(){
  const { data } = await supabaseClient.from("nfts_data").select("*");

  relicsData = [];
  totemsBestData = [];

  data.forEach(item=>{
    const nft = { id:item.id, img:item.img, section:item.section, type:item.type };

    if(item.section==="relics") relicsData.push(nft);
    if(item.section==="totems" && item.type==="best") totemsBestData.push(nft);
  });

  render("relics-gallery", relicsData);
  render("totems-gallery", totemsBestData);
}

function render(id,data){
  const el=document.getElementById(id);
  el.innerHTML="";

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="nft-card";
    div.innerHTML=`<img src="${item.img}">`;

    div.querySelector("img").onclick=()=>{
      document.getElementById("modalImage").src=item.img;
      document.getElementById("previewModal").style.display="flex";
    };

    el.appendChild(div);
  });
}

loadNFTs();

document.getElementById("closePreview").onclick=()=>{
  document.getElementById("previewModal").style.display="none";
};
</script>

</body>
</html>
