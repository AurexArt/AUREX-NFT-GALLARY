<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      background:linear-gradient(135deg,#0a001f,#1a0033,#0a001f);
      color:white;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:60px 20px 20px;
      position:relative;
    }

    h1{
      font-size:5rem;
      color:#ff00ff;
      text-shadow:0 0 25px #ff00ff,0 0 60px #6a00ff;
      margin-bottom:15px;
      letter-spacing:2px;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      padding:12px 26px;
      background:transparent;
      border:2px solid #00ffff;
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:#00ffff;
      color:black;
      transform:scale(1.05);
      box-shadow:0 0 15px #00ffff;
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:18px;
      background:#140029;
      flex-wrap:wrap;
    }

    .nav-btn.active{
      background:#ff00ff;
      border-color:#ff00ff;
      color:black;
    }

    .section{ display:none; }
    .section.active{ display:block; }

    .legendary-banner{
      max-width:900px;
      margin:25px auto;
      padding:18px;
      text-align:center;
      font-size:1.5rem;
      font-weight:bold;
      border-radius:15px;
      color:black;
      background:linear-gradient(45deg,#ffd700,#ff9900);
      box-shadow:0 0 20px gold;
    }

    .gallery{
      width:100%;
      padding:12px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .nft-card{
      background:#1d0037;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #440066;
      position:relative;
      transition:0.3s;
    }

    .nft-card:hover{
      transform:scale(1.03);
      box-shadow:0 0 20px rgba(255,0,255,0.4);
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      cursor:pointer;
    }

    .delete-checkbox{
      position:absolute;
      top:10px;
      right:10px;
      width:22px;
      height:22px;
      accent-color:#ff00ff;
      display:none;
    }

    @media(min-width:768px){
      .gallery{ grid-template-columns:repeat(5,1fr); }
    }

    @media(min-width:1024px){
      .gallery{ grid-template-columns:repeat(6,1fr); }
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      z-index:1000;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal-content{
      background:linear-gradient(135deg,#1a0033,#2a004d);
      width:100%;
      max-width:520px;
      border-radius:20px;
      padding:25px;
      border:2px solid #ff00ff;
    }

    .close{
      position:absolute;
      top:10px;
      right:15px;
      font-size:30px;
      cursor:pointer;
      color:#ff00ff;
    }

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.9);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:9999;
    }

    .loader{
      width:70px;
      height:70px;
      border:6px solid #333;
      border-top:6px solid #00ffff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{ transform:rotate(360deg); }
    }

    .loader-text{
      margin-top:20px;
      color:#00ffff;
      font-size:1.3rem;
    }

  </style>
</head>

<body>

<header>
  <h1>AUREX</h1>

  <div class="header-buttons">
    <button id="loginBtn">LOGIN</button>
    <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
    <button id="deleteModeBtn" style="display:none;background:#ff0033;">DELETE MODE</button>
    <button id="confirmDeleteBtn" style="display:none;background:#ff0000;">DELETE SELECTED</button>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn active" id="relicsBtn">RELICS</button>
  <button class="nav-btn" id="totemsBtn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
  <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
  <div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
  <div class="gallery" id="totems-gallery"></div>
</section>

<!-- PREVIEW -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <span class="close" id="closePreview">&times;</span>
    <img id="modalImage" style="width:100%;border-radius:12px;">
  </div>
</div>

<!-- UPLOAD -->
<div class="modal" id="uploadModal">
  <div class="modal-content">
    <span class="close" id="closeUpload">&times;</span>
    <h2 style="text-align:center;">UPLOAD NFT</h2>

    <input type="file" id="imageUpload" multiple style="width:100%;margin-top:15px;">

    <div style="margin-top:20px;text-align:center;">
      <button onclick="uploadNFTs()">UPLOAD</button>
      <button onclick="closeUploadModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader"></div>
  <div class="loader-text" id="loaderText">Uploading...</div>
</div>

<script>

const SUPABASE_URL="https://svlhichdvqkjqdyxposi.supabase.co";
const SUPABASE_KEY="YOUR_KEY";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let relicsData=[],totemsBestData=[],totemsLegendaryData=[];
let isLoggedIn=false;
let deleteMode=false;
let selected=new Set();

/* LOAD */
async function loadNFTs(){
  const {data}=await supabaseClient.from("nfts_data").select("*");

  relicsData=[]; totemsBestData=[]; totemsLegendaryData=[];

  data.forEach(i=>{
    const nft={id:i.id,img:i.img,section:i.section,type:i.type};
    if(i.section==="relics") relicsData.push(nft);
    else if(i.type==="best") totemsBestData.push(nft);
    else totemsLegendaryData.push(nft);
  });

  render("relics-gallery",relicsData);
  render("totems-gallery",totemsBestData);
}

/* RENDER */
function render(id,data){
  const el=document.getElementById(id);
  el.innerHTML="";

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="nft-card";

    div.innerHTML=`
      <img src="${item.img}">
      <input type="checkbox" class="delete-checkbox">
    `;

    const cb=div.querySelector("input");

    cb.style.display=deleteMode?"block":"none";

    cb.onchange=()=>{
      cb.checked?selected.add(item.id):selected.delete(item.id);
    };

    div.querySelector("img").onclick=()=>{
      if(!deleteMode){
        document.getElementById("modalImage").src=item.img;
        document.getElementById("previewModal").style.display="flex";
      }
    };

    el.appendChild(div);
  });
}

/* DELETE */
async function deleteSelected(){
  for(let id of selected){
    await supabaseClient.from("nfts_data").delete().eq("id",id);
  }
  selected.clear();
  await loadNFTs();
}

/* UPLOAD */
async function uploadNFTs(){
  const files=document.getElementById("imageUpload").files;
  if(!files.length) return;

  document.getElementById("loader").style.display="flex";

  for(let file of files){
    const name=`${Date.now()}-${file.name}`;

    await supabaseClient.storage.from("nfts").upload(name,file,{upsert:true});
    const {data}=supabaseClient.storage.from("nfts").getPublicUrl(name);

    await supabaseClient.from("nfts_data").insert([{
      img:data.publicUrl,
      section:"relics",
      type:"best"
    }]);
  }

  await loadNFTs();
  document.getElementById("loader").style.display="none";
  closeUploadModal();
}

/* LOGIN */
document.getElementById("loginBtn").onclick=()=>{
  const p=prompt("Secret");
  if(p==="tmkc"){
    isLoggedIn=true;
    document.getElementById("uploadBtn").style.display="block";
    document.getElementById("deleteModeBtn").style.display="block";
  }
};

/* DELETE MODE */
document.getElementById("deleteModeBtn").onclick=()=>{
  deleteMode=!deleteMode;

  document.querySelectorAll(".delete-checkbox").forEach(cb=>{
    cb.style.display=deleteMode?"block":"none";
    cb.checked=false;
  });

  selected.clear();
};

/* CONFIRM */
document.getElementById("confirmDeleteBtn").onclick=deleteSelected;

/* MODALS */
function closeUploadModal(){
  document.getElementById("uploadModal").style.display="none";
}

document.getElementById("uploadBtn").onclick=()=>{
  document.getElementById("uploadModal").style.display="flex";
};

document.getElementById("closePreview").onclick=()=>{
  document.getElementById("previewModal").style.display="none";
};

loadNFTs();

</script>

</body>
</html>
