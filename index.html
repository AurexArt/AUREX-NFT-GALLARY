<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      background: radial-gradient(circle at top,#1a0033,#050010,#000);
      color:white;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:60px 20px 20px;
      position:relative;
    }

    h1{
      font-family:'Orbitron',sans-serif;
      font-size:5rem;
      color:#ff00ff;
      text-shadow:0 0 30px #ff00ff;
      letter-spacing:2px;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:12px;
    }

    button{
      padding:12px 28px;
      background:rgba(255,255,255,0.05);
      border:1px solid #00ffff;
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:linear-gradient(90deg,#ff00ff,#00ffff);
      color:black;
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:20px;
      background:rgba(255,255,255,0.03);
      backdrop-filter:blur(10px);
    }

    .nav-btn.active{
      background:#ff00ff;
      color:black;
    }

    .section{display:none;}
    .section.active{display:block;}

    .gallery{
      width:100%;
      padding:15px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    @media(min-width:768px){
      .gallery{grid-template-columns:repeat(5,1fr);}
    }

    @media(min-width:1024px){
      .gallery{grid-template-columns:repeat(6,1fr);}
    }

    .nft-card{
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      overflow:hidden;
      transition:0.3s;
    }

    .nft-card:hover{
      transform:scale(1.05);
      border-color:#00ffff;
      box-shadow:0 0 20px #00ffff;
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      cursor:pointer;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .modal-content{
      background:#1a0033;
      padding:20px;
      border-radius:20px;
      max-width:600px;
      width:100%;
      position:relative;
      border:1px solid #ff00ff;
    }

    .close{
      position:absolute;
      top:10px;
      right:15px;
      font-size:30px;
      cursor:pointer;
      color:#ff00ff;
    }

    .modal-content img{
      width:100%;
      border-radius:12px;
    }

    .delete-btn{
      margin-top:10px;
      width:100%;
      padding:10px;
      background:red;
      border:none;
      border-radius:10px;
      color:white;
      cursor:pointer;
    }

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.9);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:9999;
    }

    .loader{
      width:70px;
      height:70px;
      border:6px solid #333;
      border-top:6px solid #00ffff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{100%{transform:rotate(360deg);}}

    .loader-text{
      margin-top:20px;
      color:#00ffff;
    }
  </style>
</head>

<body>

<header>
  <h1>AUREX</h1>
  <div class="header-buttons">
    <button id="loginBtn">LOGIN</button>
    <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn active" id="relicsBtn">RELICS</button>
  <button class="nav-btn" id="totemsBtn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
  <div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
  <div class="gallery" id="totems-gallery"></div>
</section>

<!-- PREVIEW -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <span class="close" id="closePreview">&times;</span>
    <img id="modalImage">
  </div>
</div>

<!-- UPLOAD -->
<div class="modal" id="uploadModal">
  <div class="modal-content">
    <span class="close" id="closeUpload">&times;</span>

    <h2 style="text-align:center;">UPLOAD NFT</h2>

    <input type="file" id="imageUpload" multiple
      style="width:100%;padding:10px;margin-top:15px;background:#2a004d;color:white;border-radius:10px;"/>

    <div style="margin-top:15px;text-align:center;">
      <button onclick="uploadNFTs()">UPLOAD</button>
      <button onclick="closeUploadModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader"></div>
  <div class="loader-text" id="loaderText">Uploading...</div>
</div>

<script>

const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let relicsData=[];
let totemsBestData=[];
let totemsLegendaryData=[];
let isLoggedIn=false;

/* LOAD */
async function loadNFTs(){
  const {data}=await supabaseClient.from("nfts_data").select("*");

  relicsData=[];
  totemsBestData=[];
  totemsLegendaryData=[];

  data.forEach(item=>{
    const nft={id:item.id,img:item.img,section:item.section,type:item.type};

    if(item.section==="relics") relicsData.push(nft);
    else if(item.section==="totems"){
      if(item.type==="best") totemsBestData.push(nft);
      else totemsLegendaryData.push(nft);
    }
  });

  render("relics-gallery",relicsData);
  render("totems-gallery",totemsBestData);
}

/* RENDER */
function render(id,data){
  const el=document.getElementById(id);
  el.innerHTML="";

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="nft-card";
    div.innerHTML=`<img src="${item.img}">`;

    div.querySelector("img").onclick=()=>{
      document.getElementById("modalImage").src=item.img;
      document.getElementById("previewModal").style.display="flex";
    };

    if(isLoggedIn){
      const btn=document.createElement("button");
      btn.innerText="DELETE";
      btn.className="delete-btn";
      btn.onclick=async(e)=>{
        e.stopPropagation();
        await supabaseClient.from("nfts_data").delete().eq("id",item.id);
        loadNFTs();
      };
      div.appendChild(btn);
    }

    el.appendChild(div);
  });
}

/* UPLOAD */
async function uploadNFTs(){
  const files=document.getElementById("imageUpload").files;
  if(files.length===0) return alert("Select images");

  document.getElementById("loader").style.display="flex";

  let count=0;

  for(let file of files){
    const name=`${Date.now()}-${Math.random()}.png`;

    await supabaseClient.storage.from("nfts").upload(name,file,{upsert:true});

    const {data}=supabaseClient.storage.from("nfts").getPublicUrl(name);

    await supabaseClient.from("nfts_data").insert([{
      img:data.publicUrl,
      section:"relics",
      type:"best"
    }]);

    count++;
  }

  document.getElementById("loaderText").innerText=`${count} Uploaded`;
  await loadNFTs();

  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
    closeUploadModal();
  },1500);
}

/* LOGIN */
document.getElementById("loginBtn").onclick=()=>{
  const p=prompt("Secret");
  if(p==="tmkc"){
    isLoggedIn=true;
    document.getElementById("uploadBtn").style.display="block";
    alert("Login OK");
  }
};

/* MODALS */
function closeUploadModal(){
  document.getElementById("uploadModal").style.display="none";
}

document.getElementById("uploadBtn").onclick=()=>{
  document.getElementById("uploadModal").style.display="flex";
};

document.getElementById("closePreview").onclick=()=>{
  document.getElementById("previewModal").style.display="none";
};

/* NAV */
document.getElementById("relicsBtn").onclick=()=>{
  document.getElementById("relics-section").classList.add("active");
  document.getElementById("totems-section").classList.remove("active");
  render("relics-gallery",relicsData);
};

document.getElementById("totemsBtn").onclick=()=>{
  document.getElementById("totems-section").classList.add("active");
  document.getElementById("relics-section").classList.remove("active");
  render("totems-gallery",totemsBestData);
};

loadNFTs();

</script>

</body>
</html>
