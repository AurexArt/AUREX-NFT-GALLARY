<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      color:#fff;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:80px 20px 30px;
      position:relative;
    }

    h1{
      font-size:5rem;
      color:#ffaa00;
      letter-spacing:8px;
      font-family:Georgia,serif;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:12px;
    }

    button{
      padding:12px 24px;
      border-radius:50px;
      border:2px solid;
      background:transparent;
      cursor:pointer;
      font-weight:bold;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    #loginBtn{
      border-color:#ffd700;
      color:#ffd700;
    }

    #uploadBtn{
      border-color:#ffaa00;
      color:#ffaa00;
    }

    #deleteModeBtn{
      border-color:#ff3300;
      color:#ff3300;
      font-size:18px;
      padding:10px 18px;
    }

    #deleteModeBtn:hover{
      background:#ff3300;
      color:white;
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:20px;
      background:#0a0a0a;
      flex-wrap:wrap;
    }

    .nav-btn{
      border-color:#ffbb33;
      color:#ffbb33;
    }

    .nav-btn.active,
    .nav-btn:hover{
      border-color:#ffdd77;
      color:#ffdd77;
      box-shadow:0 0 12px #ffbb33;
    }

    .section{
      display:none;
    }

    .section.active{
      display:block;
    }

    .legendary-banner{
      text-align:center;
      margin:25px 0;
      color:#ffcc66;
      font-size:1.5rem;
      font-weight:bold;
    }
    #uploadNowBtn{
  color:#ffaa00;
  border-color:#ffaa00;
}

#uploadNowBtn:hover{
  box-shadow:0 0 12px #ffaa00;
}

#cancelBtn{
  color:#ff3300;
  border-color:#ff3300;
}

#cancelBtn:hover{
  box-shadow:0 0 12px #ff3300;
}
    
#uploadNowBtn{
  color:#ffaa00;
  border-color:#ffaa00;
  background:transparent;
}

#cancelBtn{
  color:#ff3300;
  border-color:#ff3300;
  background:transparent;
}
    .gallery{
      width:100%;
      padding:15px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    @media(min-width:768px){
      .gallery{
        grid-template-columns:repeat(5,1fr);
      }
    }

    @media(min-width:1024px){
      .gallery{
        grid-template-columns:repeat(6,1fr);
      }
    }

    .nft-card{
      background:#111;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #444;
      position:relative;
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
      cursor:pointer;
    }

    .delete-btn{
      position:absolute;
      top:10px;
      right:10px;
      background:#ff3300;
      color:white;
      border:none;
      padding:8px 12px;
      border-radius:8px;
      font-size:12px;
      font-weight:bold;
      cursor:pointer;
      z-index:50;
      display:none;
    }

    .delete-mode .delete-btn{
      display:block;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.96);
      z-index:1000;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    .modal-content{
      background:#111;
      width:100%;
      max-width:620px;
      padding:35px 30px;
      position:relative;
      border-radius:24px;
      border:2px solid #ff8800;
    }

    .modal h2{
      color:#ffaa00;
      text-align:center;
      margin-bottom:25px;
    }

    input[type="file"]{
      width:100%;
      padding:12px;
      background:#111;
      border:2px dashed #ff8800;
      border-radius:12px;
      color:#fff;
      margin-bottom:20px;
    }

    select{
      width:100%;
      padding:14px;
      background:#111;
      border:2px solid #444;
      border-radius:12px;
      color:#fff;
      margin:12px 0;
    }

    .modal-buttons{
      margin-top:30px;
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .close{
      position:absolute;
      top:12px;
      right:25px;
      font-size:40px;
      cursor:pointer;
      color:#ffaa00;
    }

    .modal-content img{
      width:100%;
      max-height:78vh;
      object-fit:contain;
      border-radius:12px;
      background:#000;
    }

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.95);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:99999;
    }

    .loader{
      width:80px;
      height:80px;
      border:7px solid #333;
      border-top:7px solid #ffaa00;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .loader-text{
      margin-top:25px;
      color:#ffaa00;
      font-size:1.5rem;
      font-weight:bold;
    }

    .progress-text{
      margin-top:10px;
      color:#fff;
    }

  </style>
</head>
<body>

<header>

  <h1>AUREX</h1>

  <div class="header-buttons">

    <button id="loginBtn">
      LOGIN
    </button>

    <button id="uploadBtn" style="display:none;"> UPLOAD NFT </button>

    <button id="deleteModeBtn" style="display:none;">
      🗑️
    </button>

  </div>

</header>

<nav class="nav">

  <button class="nav-btn active" id="relicsBtn">
  RELICS (<span id="relicsCount">0</span>)
</button>

  <button class="nav-btn" id="totemsBtn">
    TOTEMS
  </button>

</nav>

<section id="relics-section" class="section active">

  <div class="legendary-banner">
    ALL RELICS ARE LEGENDARY
  </div>

  <div class="gallery" id="relics-gallery"></div>

</section>

<section id="totems-section" class="section">

  <div style="text-align:center;padding:20px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap;">

    <button class="nav-btn active" id="SPECIALBtn">
  SPECIAL (<span id="bestCount">0</span>)
</button>

    <button class="nav-btn" id="legendaryBtn">
  LEGENDARY (<span id="legendaryCount">0</span>)
</button>

  </div>

  <div class="gallery" id="totems-gallery"></div>

</section>

<!-- UPLOAD MODAL -->
<div class="modal" id="uploadModal">

  <div class="modal-content">

    <span class="close" id="closeUpload">
      &times;
    </span>

    <h2>UPLOAD NFT</h2>

    <input type="file" id="imageUpload" multiple accept="image/*"/>

    <select id="nftSection">
      <option value="relics">Relics</option>
      <option value="totems">Totems</option>
    </select>

    <select id="totemType" style="display:none;">
      <option value="best">SPECIAL</option>
      <option value="legendary">Legendary</option>
    </select>

    <div class="modal-buttons">

      <button onclick="uploadNFTs()" id="uploadNowBtn">
  UPLOAD NOW
</button>

      <button onclick="closeUploadModal()" id="cancelBtn">
  CANCEL
</button>

    </div>

  </div>

</div>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal">

  <div class="modal-content">

    <span class="close" id="closePreview">
      &times;
    </span>

    <img id="modalImage" src="">

  </div>

</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">

  <div class="loader"></div>

  <div class="loader-text" id="loaderText">
    Uploading NFTs...
  </div>

  <div class="progress-text" id="progressText">
    0/0
  </div>

</div>

<script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [];
    let totemsSPECIALData = [];
    let totemsLegendaryData = [];
    let isLoggedIn = false;
    let deleteMode = false;

    async function loadNFTs(){
  const { data } = await supabaseClient
    .from("nfts_data")
    .select("*")
    .order("id", { ascending: false });

  relicsData = [];
  totemsBestData = [];
  totemsLegendaryData = [];

  data.forEach(item => {
    const nft = {
      id: item.id,
      img: item.img,
      section: item.section,
      type: item.type
    };

    if (item.section === "relics") {
      relicsData.push(nft);

    } else if (item.section === "totems") {

      if (item.type === "best") {
        totemsSPECIALData.push(nft);

      } else if (item.type === "legendary") {
        totemsLegendaryData.push(nft);
      }
    }
  });

  renderGallery("relics-gallery", relicsData);
  renderGallery("totems-gallery", totemsSPECIALData);

  // COUNTS
  document.getElementById("relicsCount").innerText = relicsData.length;

  document.getElementById("SPECIALCount").innerText = totemsSPECIALData.length;

  document.getElementById("legendaryCount").innerText = totemsLegendaryData.length;
}
  
    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = "<h2 style='text-align:center;width:100%;padding:40px;'>No NFTs Yet</h2>";
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.innerHTML = `<img src="${item.img}" alt="NFT">`;

        if(isLoggedIn){
          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerText = "DELETE";
          delBtn.onclick = () => deleteNFT(item.id);
          card.appendChild(delBtn);
        }

        card.querySelector("img").onclick = () => {
          document.getElementById("modalImage").src = item.img;
          document.getElementById("previewModal").style.display = "flex";
        };
        container.appendChild(card);
      });
    }

    // ====================== DELETE FROM BOTH DB + STORAGE ======================
    async function deleteNFT(id){
      if(!confirm("Delete this NFT permanently from everywhere?")) return;

      try {
        // Pehle database se image URL le lo
        const { data: nft } = await supabaseClient
          .from("nfts_data")
          .select("img")
          .eq("id", id)
          .single();

        if(nft && nft.img){
          // Storage se delete
          const imagePath = nft.img.split("/nfts/")[1];
          if(imagePath){
            await supabaseClient.storage.from("nfts").remove([imagePath]);
          }
        }

        // Database se delete
        await supabaseClient.from("nfts_data").delete().eq("id", id);

        alert("NFT Deleted Successfully");
        await loadNFTs();
      } catch(err){
        console.error(err);
        alert("Delete Failed");
      }
    }

    // ====================== UPLOAD WITH PROGRESS ======================
    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select images");

      document.getElementById("loader").style.display = "flex";
      document.getElementById("loaderText").innerText = "Uploading...";
      document.getElementById("progressText").innerText = `0/${files.length}`;

      const section = document.getElementById("nftSection").value;
      const totemType = document.getElementById("totemType").value;

      let uploadedCount = 0;

      for(let i = 0; i < files.length; i++){
        const file = files[i];
        try{
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${section}/${fileName}`;

          await supabaseClient.storage.from("nfts").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("nfts").getPublicUrl(path);

          await supabaseClient.from("nfts_data").insert([{
            title: "Untitled",
            description: "",
            img: urlData.publicUrl,
            section: section,
            type: totemType || null
          }]);

          uploadedCount++;
          document.getElementById("progressText").innerText = `${uploadedCount}/${files.length}`;
        } catch(err){
          console.log(err);
        }
      }

      document.getElementById("loaderText").innerText = "✅ Upload Complete!";
      document.getElementById("progressText").innerText = `${uploadedCount} NFT(s) Uploaded Successfully`;

      await loadNFTs();

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        closeUploadModal();
      }, 1800);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
    }

    // Login, Navigation, etc. (same)
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn && deleteMode){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("deleteModeBtn").style.display = "none";

deleteMode = false;

document.body.classList.remove("delete-mode");
        loadNFTs();
        alert("Logged Out");
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        document.getElementById("deleteModeBtn").style.display = "block";
        loadNFTs();
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });
  
    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation Buttons
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
      renderGallery("relics-gallery", relicsData);
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsSPECIALData);
    });

    document.getElementById("SPECIALBtn").addEventListener("click", () => {
      document.getElementById("SPECIALBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsSPECIALData);
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
      document.getElementById("legendaryBtn").classList.add("active");
      document.getElementById("SPECIALBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsLegendaryData);
    });
    document.getElementById("deleteModeBtn")
.addEventListener("click", async () => {

  deleteMode = !deleteMode;

  if(deleteMode){

    document.body.classList.add("delete-mode");

  }else{

    document.body.classList.remove("delete-mode");
  }

  await loadNFTs();
});
    loadNFTs();
  </script>
</body>
</html>
