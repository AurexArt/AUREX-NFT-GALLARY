<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a001f;color:white;font-family:Arial;overflow-x:hidden;}

    header{text-align:center;padding:60px 20px 20px;position:relative;}
    h1{font-size:5rem;color:#ff00ff;text-shadow:0 0 25px #ff00ff;}

    .header-buttons{
      position:absolute;top:20px;right:20px;display:flex;gap:12px;
    }

    button{
      padding:12px 28px;
      background:transparent;
      border:2px solid #00ffff;
      color:#00ffff;
      border-radius:50px;
      cursor:pointer;
    }

    .nav{display:flex;justify-content:center;gap:20px;padding:20px;background:#140029;}
    .nav-btn.active{background:#ff00ff;color:black;}

    .section{display:none;}
    .section.active{display:block;}

    .gallery{
      width:100%;
      padding:8px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
    }

    .nft-card{
      background:#1d0037;border-radius:10px;overflow:hidden;
    }

    .nft-card img{
      width:100%;aspect-ratio:1/1;object-fit:cover;
    }

    .modal{
      display:none;
      position:fixed;inset:0;
      background:rgba(0,0,0,0.92);
      justify-content:center;align-items:center;
    }

    .modal-content{
      background:#1a0033;
      width:100%;max-width:550px;
      padding:25px;border-radius:20px;
      position:relative;
    }

    .close{position:absolute;top:10px;right:15px;font-size:30px;cursor:pointer;}

    input,textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#2a004d;
      color:white;
      border:none;
      border-radius:10px;
    }

    .delete-btn{
      width:100%;
      margin-top:10px;
      background:red;
      color:white;
      padding:10px;
      border:none;
      border-radius:10px;
    }
  </style>
</head>

<body>

<header>
  <h1>AUREX</h1>

  <div class="header-buttons">
    <button id="loginBtn">LOGIN</button>
    <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
  </div>
</header>

<nav class="nav">
  <button id="relicsBtn" class="nav-btn active">RELICS</button>
  <button id="totemsBtn" class="nav-btn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
  <div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
  <div class="gallery" id="totems-gallery"></div>
</section>

<!-- PREVIEW -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <span class="close" id="closePreview">&times;</span>

    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>

    <input id="editTitle" style="display:none;" placeholder="Edit Title"/>
    <textarea id="editDesc" style="display:none;" rows="4"></textarea>

    <button id="saveDescBtn" style="display:none;margin-top:10px;">
      SAVE
    </button>
  </div>
</div>

<script>

const supabaseClient = supabase.createClient(
  "https://svlhichdvqkjqdyxposi.supabase.co",
  "YOUR_KEY"
);

let relicsData=[], totemsData=[];
let isLoggedIn=false;
let currentNFT=null;

async function loadNFTs(){
  const {data}=await supabaseClient.from("nfts_data").select("*");

  relicsData=[];
  totemsData=[];

  data.forEach(i=>{
    const nft={
      id:i.id,
      title:i.title,
      desc:i.description,
      img:i.img,
      section:i.section
    };

    if(i.section==="relics") relicsData.push(nft);
    else totemsData.push(nft);
  });

  render("relics-gallery",relicsData);
  render("totems-gallery",totemsData);
}

function render(id,data){
  const c=document.getElementById(id);
  c.innerHTML="";

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="nft-card";

    div.innerHTML=`<img src="${item.img}">`;

    div.querySelector("img").onclick=()=>open(item);

    c.appendChild(div);
  });
}

function open(item){
  currentNFT=item;

  document.getElementById("previewModal").style.display="flex";
  document.getElementById("modalTitle").innerText=item.title;
  document.getElementById("modalDesc").innerText=item.desc;

  if(isLoggedIn){
    document.getElementById("editTitle").style.display="block";
    document.getElementById("editDesc").style.display="block";
    document.getElementById("saveDescBtn").style.display="block";

    document.getElementById("editTitle").value=item.title;
    document.getElementById("editDesc").value=item.desc;
  }else{
    document.getElementById("editTitle").style.display="none";
    document.getElementById("editDesc").style.display="none";
    document.getElementById("saveDescBtn").style.display="none";
  }
}

document.getElementById("saveDescBtn").onclick=async()=>{

  const newTitle=document.getElementById("editTitle").value;
  const newDesc=document.getElementById("editDesc").value;

  await supabaseClient.from("nfts_data")
  .update({
    title:newTitle,
    description:newDesc
  })
  .eq("id",currentNFT.id);

  currentNFT.title=newTitle;
  currentNFT.desc=newDesc;

  document.getElementById("modalTitle").innerText=newTitle;
  document.getElementById("modalDesc").innerText=newDesc;

  loadNFTs();
};

document.getElementById("closePreview").onclick=()=>{
  document.getElementById("previewModal").style.display="none";
};

document.getElementById("loginBtn").onclick=()=>{
  const pass=prompt("Enter Secret");

  if(pass==="tmkc"||pass==="Tmkc"){
    isLoggedIn=true;
    document.getElementById("uploadBtn").style.display="block";
    alert("Login Success");
  }
};

document.getElementById("relicsBtn").onclick=()=>{
  render("relics-gallery",relicsData);
};

document.getElementById("totemsBtn").onclick=()=>{
  render("totems-gallery",totemsData);
};

loadNFTs();

</script>

</body>
</html>
