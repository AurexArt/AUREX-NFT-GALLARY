<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:
    radial-gradient(circle at top,#221100 0%,#000 40%),
    #000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

header{
  text-align:center;
  padding:80px 20px 40px;
  position:relative;
}

h1{
  font-size:5rem;
  letter-spacing:10px;
  font-family:Georgia,serif;

  background:linear-gradient(
    90deg,
    #ffcc33,
    #ffaa00,
    #ffdd66
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 0 10px rgba(255,170,0,.3),
    0 0 25px rgba(255,170,0,.15);
}

.header-buttons{
  position:absolute;
  top:20px;
  right:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

button{
  padding:12px 24px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.15);

  background:rgba(255,255,255,.03);

  backdrop-filter:blur(8px);

  cursor:pointer;
  font-weight:bold;

  transition:.3s;
}

button:hover{
  transform:translateY(-2px) scale(1.05);

  box-shadow:
    0 0 15px rgba(255,170,0,.2);
}

#loginBtn{
  border-color:#ffd700;
  color:#ffd700;
}

#uploadBtn{
  border-color:#ffaa00;
  color:#ffaa00;
}

#deleteModeBtn{
  border-color:#ff4444;
  color:#ff4444;
}

#selectAllBtn{
  border-color:#00ff99;
  color:#00ff99;
}

.nav{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

.nav-btn{
  color:#ffcc66;
}

.nav-btn.active,
.nav-btn:hover{
  border-color:#ffcc66;
  box-shadow:0 0 20px rgba(255,204,102,.35);
  color:#fff;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.legendary-banner{
  text-align:center;
  margin:20px 0;
  font-size:1.4rem;
  font-weight:bold;
  color:#ffcc66;
  text-shadow:0 0 10px rgba(255,204,102,.5);
}

.gallery{
  width:100%;
  padding:25px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

@media(min-width:768px){
  .gallery{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(min-width:1200px){
  .gallery{
    grid-template-columns:repeat(5,1fr);
  }
}

 .nft-card{
  background:#111;
  border-radius:20px;
  overflow:hidden;

  border:1px solid rgba(255,255,255,.08);

  position:relative;

  transition:.35s;
}

.nft-card:hover{
  transform:translateY(-6px);

  box-shadow:
    0 0 20px rgba(255,170,0,.18);
}

.nft-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  cursor:pointer;

  transition:.4s;
}

.nft-card:hover img{
  transform:scale(1.05);
}

.bulk-checkbox{
  accent-color:#ffaa00;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  z-index:1000;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-content{
  background:rgba(15,15,15,.96);
  backdrop-filter:blur(18px);
  width:100%;
  max-width:650px;
  padding:35px;
  border:1px solid rgba(255,170,0,.25);
  box-shadow:
  0 0 25px rgba(255,170,0,.15);
  position:relative;
}

.modal h2{
  text-align:center;
  color:#ffaa00;
  margin-bottom:25px;
  font-size:2rem;
}

.close{
  position:absolute;
  top:10px;
  right:20px;
  font-size:38px;
  color:#ffaa00;
  cursor:pointer;
}

input[type="file"],
select{
  width:100%;
  padding:15px;
  background:#0f0f0f;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  color:#fff;
  margin:12px 0;
}

.modal-content img{
  width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:20px;
}

.loader-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  backdrop-filter:blur(10px);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:99999;
}

.loader{
  width:85px;
  height:85px;
  border:7px solid #222;
  border-top:7px solid #ffaa00;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.loader-text{
  margin-top:25px;
  color:#ffaa00;
  font-size:1.6rem;
  font-weight:bold;
}

.progress-text{
  margin-top:10px;
  color:#ddd;
}

  </style>
</head>
<body>

<header>

  <h1>AUREX</h1>

  <div class="header-buttons">

    <button id="loginBtn">
      LOGIN
    </button>

    <button id="uploadBtn" style="display:none;"> UPLOAD NFT </button>

    <button id="deleteModeBtn" style="display:none;">
      🗑️
    </button>
    
    <button id="selectAllBtn" style="display:none;">
  SELECT ALL
    </button>

  </div>

</header>

<nav class="nav">

  <button class="nav-btn active" id="relicsBtn">
  RELICS (<span id="relicsCount">0</span>)
</button>

  <button class="nav-btn" id="totemsBtn">
    TOTEMS
  </button>

</nav>

<section id="relics-section" class="section active">

  <div class="legendary-banner">
    ALL RELICS ARE LEGENDARY
  </div>

  <div class="gallery" id="relics-gallery"></div>

</section>

<section id="totems-section" class="section">

  <div style="text-align:center;padding:20px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap;">

    <button class="nav-btn active" id="SPECIALBtn">
  SPECIAL (<span id="SPECIALCount">0</span>)
</button>

    <button class="nav-btn" id="legendaryBtn">
  LEGENDARY (<span id="legendaryCount">0</span>)
</button>

  </div>

  <div class="gallery" id="totems-gallery"></div>

</section>

<!-- UPLOAD MODAL -->
<div class="modal" id="uploadModal">

  <div class="modal-content">

    <span class="close" id="closeUpload">
      &times;
    </span>

    <h2>UPLOAD NFT</h2>

    <input type="file" id="imageUpload" multiple accept="image/*"/>

    <select id="nftSection">
      <option value="relics">Relics</option>
      <option value="totems">Totems</option>
    </select>

    <select id="totemType" style="display:none;">
      <option value="SPECIAL">SPECIAL</option>
      <option value="legendary">Legendary</option>
    </select>

    <div class="modal-buttons">

      <button onclick="uploadNFTs()" id="uploadNowBtn">
  UPLOAD NOW
</button>

      <button onclick="closeUploadModal()" id="cancelBtn">
  CANCEL
</button>

    </div>

  </div>

</div>

<!-- PREVIEW MODAL -->
<div class="modal" id="previewModal">

  <div class="modal-content">

    <span class="close" id="closePreview">
      &times;
    </span>

    <img id="modalImage" src="">

  </div>

</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">

  <div class="loader"></div>

  <div class="loader-text" id="loaderText">
    Uploading NFTs...
  </div>

  <div class="progress-text" id="progressText">
    0/0
  </div>

</div>

<script>
    const SUPABASE_URL = "https://svlhichdvqkjqdyxposi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let relicsData = [];
    let totemsSPECIALData = [];
    let totemsLegendaryData = [];
    let isLoggedIn = false;
    let deleteMode = false;

    async function loadNFTs(){
  const { data } = await supabaseClient
    .from("nfts_data")
    .select("*")
    .order("id", { ascending: false });

  relicsData = [];
  totemsSPECIALData = [];
  totemsLegendaryData = [];

  data.forEach(item => {
    const nft = {
      id: item.id,
      img: item.img,
      section: item.section,
      type: item.type
    };

    if (item.section === "relics") {
      relicsData.push(nft);

    } else if (item.section === "totems") {

      if (item.type === "SPECIAL") {
        totemsSPECIALData.push(nft);

      } else if (item.type === "legendary") {
        totemsLegendaryData.push(nft);
      }
    }
  });

  renderGallery("relics-gallery", relicsData);
  renderGallery("totems-gallery", totemsSPECIALData);

  // COUNTS
  document.getElementById("relicsCount").innerText = relicsData.length;

  document.getElementById("SPECIALCount").innerText = totemsSPECIALData.length;

  document.getElementById("legendaryCount").innerText = totemsLegendaryData.length;
}
    let selectedNFTs = [];
  
    function renderGallery(containerId, data){

  const container = document.getElementById(containerId);
  container.innerHTML = "";

  if(data.length === 0){
    container.innerHTML =
      "<h2 style='text-align:center;width:100%;padding:40px;'>No NFTs Yet</h2>";
    return;
  }

  data.forEach(item => {

    const card = document.createElement("div");
    card.className = "nft-card";

    card.innerHTML = `
      <img src="${item.img}" alt="NFT">

      ${
        deleteMode
        ? `<input type="checkbox"
             class="bulk-checkbox"
             data-id="${item.id}"
             style="
               position:absolute;
               top:12px;
               right:12px;
               width:22px;
               height:22px;
               z-index:50;
               cursor:pointer;
             ">`
        : ""
      }
    `;

    // IMAGE PREVIEW
    card.querySelector("img").onclick = () => {

      if(deleteMode) return;

      document.getElementById("modalImage").src = item.img;
      document.getElementById("previewModal").style.display = "flex";
    };

    // BULK SELECT
    if(deleteMode){

      const checkbox = card.querySelector(".bulk-checkbox");

      checkbox.addEventListener("change", function(){

        if(this.checked){

          selectedNFTs.push({
            id: item.id,
            img: item.img
          });

        }else{

          selectedNFTs = selectedNFTs.filter(
            nft => nft.id !== item.id
          );
        }
      });
    }

    container.appendChild(card);
  });
}
   
    // ====================== UPLOAD WITH PROGRESS ======================
    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select images");

      document.getElementById("loader").style.display = "flex";
      document.getElementById("loaderText").innerText = "Uploading...";
      document.getElementById("progressText").innerText = `0/${files.length}`;

      const section = document.getElementById("nftSection").value;
      const totemType = document.getElementById("totemType").value;

      let uploadedCount = 0;

      for(let i = 0; i < files.length; i++){
        const file = files[i];
        try{
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${section}/${fileName}`;

          await supabaseClient.storage.from("nfts").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("nfts").getPublicUrl(path);

          await supabaseClient.from("nfts_data").insert([{
            title: "Untitled",
            description: "",
            img: urlData.publicUrl,
            section: section,
            type: totemType || null
          }]);

          uploadedCount++;
          document.getElementById("progressText").innerText = `${uploadedCount}/${files.length}`;
        } catch(err){
          console.log(err);
        }
      }

      document.getElementById("loaderText").innerText = "✅ Upload Complete!";
      document.getElementById("progressText").innerText = `${uploadedCount} NFT(s) Uploaded Successfully`;

      await loadNFTs();

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        closeUploadModal();
      }, 1800);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
    }

    // Login, Navigation, etc. (same)
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn && deleteMode){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("deleteModeBtn").style.display = "none";
        document.getElementById("selectAllBtn").style.display = "none";

deleteMode = false;

document.body.classList.remove("delete-mode");


        loadNFTs();
        alert("Logged Out");
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        document.getElementById("deleteModeBtn").style.display = "block";
        
        loadNFTs();
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });
  
    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");

    document.getElementById("nftSection").addEventListener("change", function(){
      document.getElementById("totemType").style.display = this.value === "totems" ? "block" : "none";
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation Buttons
    document.getElementById("relicsBtn").addEventListener("click", () => {
      document.getElementById("relics-section").classList.add("active");
      document.getElementById("totems-section").classList.remove("active");
      document.getElementById("relicsBtn").classList.add("active");
      document.getElementById("totemsBtn").classList.remove("active");
      renderGallery("relics-gallery", relicsData);
    });

    document.getElementById("totemsBtn").addEventListener("click", () => {
      document.getElementById("totems-section").classList.add("active");
      document.getElementById("relics-section").classList.remove("active");
      document.getElementById("totemsBtn").classList.add("active");
      document.getElementById("relicsBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsSPECIALData);
    });

    document.getElementById("SPECIALBtn").addEventListener("click", () => {
      document.getElementById("SPECIALBtn").classList.add("active");
      document.getElementById("legendaryBtn").classList.remove("active");
      renderGallery("totems-gallery", totemsSPECIALData);
    });

    document.getElementById("legendaryBtn").addEventListener("click", () => {
  document.getElementById("legendaryBtn").classList.add("active");
  document.getElementById("SPECIALBtn").classList.remove("active");
  renderGallery("totems-gallery", totemsLegendaryData);
});



// ================= SELECT ALL =================

document.getElementById("selectAllBtn")
.addEventListener("click", () => {

  if(!deleteMode) return;

  selectedNFTs = [];

  const checkboxes =
    document.querySelectorAll(".bulk-checkbox");

  checkboxes.forEach(box => {

    box.checked = true;

    const id = Number(box.dataset.id);

    let currentNFTs = [];

    // RELICS SECTION
    if(
      document.getElementById("relics-section")
      .classList.contains("active")
    ){
      currentNFTs = relicsData;
    }

    // TOTEMS SPECIAL
    else if(
      document.getElementById("SPECIALBtn")
      .classList.contains("active")
    ){
      currentNFTs = totemsSPECIALData;
    }

    // TOTEMS LEGENDARY
    else{
      currentNFTs = totemsLegendaryData;
    }

    const nft = currentNFTs.find(
      item => item.id === id

    );

    if(nft){

      selectedNFTs.push({
        id: nft.id,
        img: nft.img
      });
    }
  });

  alert("All NFTs Selected");
});
document.getElementById("deleteModeBtn")
.addEventListener("click", async () => {

  // ENTER DELETE MODE
  if(!deleteMode){

    deleteMode = true;

    selectedNFTs = [];

    document.body.classList.add("delete-mode");

    document.getElementById("deleteModeBtn")
      .innerText = "DELETE SELECTED";

    document.getElementById("selectAllBtn")
      .style.display = "block";

    await loadNFTs();

    return;
  }

  // DELETE SELECTED
  if(selectedNFTs.length === 0){
    alert("No NFTs Selected");
    return;
  }

  if(!confirm(`Delete ${selectedNFTs.length} NFT(s)?`)) return;

  try{

    for(const nft of selectedNFTs){

      const imagePath =
        nft.img.split("/nfts/")[1];

      if(imagePath){

        await supabaseClient
          .storage
          .from("nfts")
          .remove([imagePath]);
      }

      await supabaseClient
        .from("nfts_data")
        .delete()
        .eq("id", nft.id);
    }

    alert("Selected NFTs Deleted");

    deleteMode = false;

    selectedNFTs = [];

    document.body.classList.remove("delete-mode");

    document.getElementById("deleteModeBtn")
      .innerText = "🗑️";

    document.getElementById("selectAllBtn")
      .style.display = "none";

    await loadNFTs();

  }catch(err){

    console.log(err);

    alert("Delete Failed");
  }
});

loadNFTs();
</script>
</body>
</html>
