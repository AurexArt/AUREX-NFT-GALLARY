<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREX | Relics & Totems</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --neon-pink: #ff00ff;
      --neon-cyan: #00ffff;
      --neon-purple: #9d00ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a001f;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 70px 20px 30px;
      position: relative;
    }

    header h1 {
      font-size: 6rem;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px var(--neon-pink);
    }

    .login-btn {
      position: absolute;
      top: 40px;
      right: 40px;
      padding: 12px 30px;
      background: transparent;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 25px;
      background: rgba(20, 0, 50, 0.8);
    }

    .nav-btn {
      padding: 15px 40px;
      font-size: 1.3rem;
      background: transparent;
      color: white;
      border: 2px solid var(--neon-pink);
      border-radius: 50px;
      cursor: pointer;
      transition: 0.4s;
    }

    .nav-btn.active {
      background: var(--neon-pink);
      color: black;
      box-shadow: 0 0 25px var(--neon-pink);
    }

    .section { display: none; }
    .section.active { display: block; }

    .legendary-banner {
      text-align: center;
      padding: 25px;
      margin: 30px auto;
      max-width: 1000px;
      background: linear-gradient(90deg, #ffd700, #ff8800);
      color: #000;
      font-size: 1.9rem;
      font-weight: bold;
      border-radius: 15px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      padding: 40px 5%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .nft-card {
      background: rgba(40, 0, 80, 0.6);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #9d00ff;
      transition: 0.4s;
    }

    .nft-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #00ffff;
    }

    .nft-card img {
      width: 100%;
      height: 340px;
      object-fit: cover;
    }

    .info {
      padding: 15px;
      text-align: center;
    }

    #upload-section {
      text-align: center;
      padding: 25px;
      margin: 20px 5%;
      background: rgba(50, 0, 100, 0.4);
      border-radius: 15px;
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      max-width: 700px;
      width: 90%;
      background: #1a0033;
      border-radius: 20px;
      overflow: hidden;
    }
    .close { position: absolute; top: 15px; right: 25px; font-size: 40px; color: #ff00ff; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <button class="login-btn" id="loginBtn">LOGIN</button>
  </header>

  <!-- Navigation -->
  <nav class="nav">
    <button class="nav-btn active" data-section="relics">RELICS</button>
    <button class="nav-btn" data-section="totems">TOTEMS</button>
  </nav>

  <!-- Relics Section -->
  <div id="relics-section" class="section active">
    <div class="legendary-banner">
      ALL RELICS ARE LEGENDARY
    </div>
    <div class="gallery" id="relics-gallery"></div>
  </div>

  <!-- Totems Section -->
  <div id="totems-section" class="section">
    <div class="nav" style="margin:20px 0;">
      <button class="nav-btn active" data-type="best">BEST</button>
      <button class="nav-btn" data-type="legendary">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </div>

  <!-- Upload Section -->
  <div id="upload-section">
    <h2>Upload New NFT</h2>
    <input type="file" id="imageUpload" accept="image/*"><br><br>
    <select id="nftType">
      <option value="relics">Relics</option>
      <option value="totems-best">Totems - Best</option>
      <option value="totems-legendary">Totems - Legendary</option>
    </select><br><br>
    <button onclick="uploadImage()">Upload Image</button>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <img id="modalImage" src="" alt="" style="width:100%; max-height:500px; object-fit:contain;">
      <div style="padding:20px; text-align:center;">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    // Supabase Config
    const SUPABASE_URL = 'https://svlhichdvqkjqdyxposi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bGhpY2hkdnFranFkeXhwb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE1NjIsImV4cCI6MjA5NDY1NzU2Mn0.zsFjmGqt4izynQ-_iMYtqxY3Q32BrYJkoGTM44K6KPM';

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let isLoggedIn = false;

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
      if (isLoggedIn) {
        await supabase.auth.signOut();
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = "LOGIN";
        document.getElementById('upload-section').style.display = 'none';
        return;
      }

      const email = prompt("Enter Email:");
      const password = prompt("Enter Password:");

      if (email === "artaurex@gmail.com" && password === "Artaurex@1233") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          alert("Error: " + error.message);
        } else {
          isLoggedIn = true;
          document.getElementById('loginBtn').textContent = "LOGOUT";
          document.getElementById('upload-section').style.display = 'block';
          alert("✅ Login Successful!");
        }
      } else {
        alert("❌ Wrong Credentials");
      }
    });

    // Upload
    async function uploadImage() {
      if (!isLoggedIn) return alert("Login first!");

      const file = document.getElementById('imageUpload').files[0];
      if (!file) return alert("Select an image!");

      const type = document.getElementById('nftType').value;
      const filePath = `${type}/${Date.now()}-${file.name}`;

      const { error } = await supabase.storage.from('nfts').upload(filePath, file, { upsert: true });

      if (error) alert("Upload Failed: " + error.message);
      else alert("✅ Uploaded Successfully!");
    }

    // Sample Data
    const relicsData = [
      { title: "Ancient Sun Relic", img: "https://picsum.photos/id/1015/800/600", desc: "Power of the eternal sun" },
      { title: "Void Crystal", img: "https://picsum.photos/id/201/800/600", desc: "Infinite darkness" }
    ];

    const totemsBestData = [
      { title: "Wolf Spirit", img: "https://picsum.photos/id/251/800/600", desc: "Guardian of the forest" }
    ];

    const totemsLegendaryData = [
      { title: "Phoenix Rebirth", img: "https://picsum.photos/id/866/800/600", desc: "Rises from ashes" }
    ];

    function renderGallery(galleryId, items) {
      const gallery = document.getElementById(galleryId);
      gallery.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "nft-card";
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div class="info">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
        `;
        card.onclick = () => showModal(item);
        gallery.appendChild(card);
      });
    }

    function showModal(item) {
      document.getElementById('modalImage').src = item.img;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalDesc').textContent = item.desc;
      document.getElementById('modal').style.display = "flex";
    }

    // Navigation Logic
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.section').forEach(section => {
          section.classList.remove('active');
        });

        if (btn.dataset.section) {
          document.getElementById(btn.dataset.section + '-section').classList.add('active');
        }
      });
    });

    // Close Modal
    document.querySelector('.close').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
    });

    // Initial Load
    window.onload = () => {
      renderGallery('relics-gallery', relicsData);
      renderGallery('totems-gallery', totemsBestData);
    };
  </script>
</body>
</html>
