<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREX | Relics & Totems</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0c001f, #1a0033, #2d004d);
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: relative;
      text-align: center;
      padding: 5rem 1rem 3rem;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid rgba(255,0,255,0.2);
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 5.5rem;
      background: linear-gradient(90deg, #ff00cc, #00f0ff, #ffd700, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(255,0,255,0.6);
      letter-spacing: 4px;
    }
    .subtitle {
      font-size: 1.5rem;
      color: #b0ffea;
      margin-top: 10px;
      letter-spacing: 5px;
      opacity: 0.9;
    }

    .login-btn {
      position: absolute;
      top: 30px;
      right: 30px;
      padding: 12px 28px;
      background: linear-gradient(45deg, #ff00ff, #00ffff);
      color: #000;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,255,0.5);
    }

    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 25px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .nav-btn {
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: 600;
      background: transparent;
      color: #fff;
      border: 2px solid #ff00ff;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #ff00ff;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff00ff;
    }

    .legendary-banner {
      text-align: center;
      padding: 22px;
      background: linear-gradient(90deg, #ffd700, #ff8800, #ffd700);
      color: #000;
      font-size: 1.8rem;
      font-weight: bold;
      margin: 30px auto;
      max-width: 1000px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,215,0,0.6);
    }

    .section { display: none; }
    .section.active { display: block; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      padding: 40px 5%;
      max-width: 1800px;
      margin: 0 auto;
    }

    .nft-card {
      background: rgba(255,255,255,0.06);
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.5s ease;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .nft-card:hover {
      transform: translateY(-15px) scale(1.04);
      box-shadow: 0 25px 50px rgba(138,43,226,0.4);
      border-color: #ff00ff;
    }
    .nft-card img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      transition: 0.4s;
    }
    .nft-card:hover img { transform: scale(1.1); }

    .info {
      padding: 20px;
      text-align: center;
    }
    .info h3 {
      font-size: 1.4rem;
      color: #ffd700;
      margin-bottom: 8px;
    }

    /* Upload */
    #upload-section {
      text-align: center;
      padding: 25px;
      background: rgba(0,0,0,0.4);
      margin: 20px 5%;
      border-radius: 20px;
      border: 1px dashed #ff00ff;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1f003d;
      max-width: 720px;
      width: 92%;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid #ff00ff;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 45px;
      cursor: pointer;
      color: #ff00ff;
    }
  </style>
</head>
<body>

  <header>
    <h1>AUREX</h1>
    <p class="subtitle">RELICS & TOTEMS</p>
    <button class="login-btn" id="loginBtn">Login</button>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-section="relics">RELICS</button>
    <button class="nav-btn" data-section="totems">TOTEMS</button>
  </nav>

  <!-- Relics -->
  <div id="relics-section" class="section active">
    <div class="legendary-banner">
      <h2>ALL RELICS ARE LEGENDARY</h2>
    </div>
    <div class="gallery" id="relics-gallery"></div>
  </div>

  <!-- Totems -->
  <div id="totems-section" class="section">
    <div class="sub-nav nav" style="padding:15px;">
      <button class="nav-btn active" data-type="best">BEST</button>
      <button class="nav-btn" data-type="legendary">LEGENDARY</button>
    </div>
    <div class="gallery" id="totems-gallery"></div>
  </div>

  <!-- Upload -->
  <div id="upload-section" style="display:none;">
    <h3>Upload New NFT</h3>
    <input type="file" id="imageUpload" accept="image/*">
    <select id="nftType">
      <option value="relics">Relics</option>
      <option value="totems-best">Totems - Best</option>
      <option value="totems-legendary">Totems - Legendary</option>
    </select>
    <button onclick="uploadImage()">Upload</button>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close">×</span>
      <img id="modalImage" src="" alt="">
      <div class="modal-info" style="padding:25px; text-align:center;">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    // Hardcoded Login
    const ADMIN_EMAIL = "artaurex@gmail.com";
    const ADMIN_PASS = "Artaurex@123";
    let isLoggedIn = false;

    // Login
    document.getElementById('loginBtn').addEventListener('click', () => {
      if (isLoggedIn) {
        isLoggedIn = false;
        document.getElementById('loginBtn').textContent = "Login";
        document.getElementById('upload-section').style.display = 'none';
        alert("Logged Out");
      } else {
        const email = prompt("Enter Email:");
        const pass = prompt("Enter Password:");
        
        if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
          isLoggedIn = true;
          document.getElementById('loginBtn').textContent = "Logout";
          document.getElementById('upload-section').style.display = 'block';
          alert("✅ Login Successful! Welcome Admin");
        } else {
          alert("❌ Wrong Email or Password");
        }
      }
    });

    // Sample NFTs
    const relicsData = [
      { title: "Ancient Sun Relic", img: "https://via.placeholder.com/600x400/4B0082/FFD700?text=Sun+Relic", desc: "Power of the eternal sun" },
      { title: "Void Crystal", img: "https://via.placeholder.com/600x400/2F004F/00FFFF?text=Void+Crystal", desc: "Holds infinite darkness" }
    ];

    const totemsBestData = [
      { title: "Wolf Spirit Totem", img: "https://via.placeholder.com/600x400/003300/FFAA00?text=Wolf+Totem", desc: "Guardian of the wild" }
    ];

    const totemsLegendaryData = [
      { title: "Phoenix Rebirth", img: "https://via.placeholder.com/600x400/8B0000/FFD700?text=Phoenix", desc: "Rises from eternal flames" }
    ];

    function renderGallery(id, data) {
      const gallery = document.getElementById(id);
      gallery.innerHTML = "";
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = "nft-card";
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div class="info">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
        `;
        card.onclick = () => {
          document.getElementById('modalImage').src = item.img;
          document.getElementById('modalTitle').textContent = item.title;
          document.getElementById('modalDesc').textContent = item.desc;
          document.getElementById('modal').style.display = "flex";
        };
        gallery.appendChild(card);
      });
    }

    // Tab Switching
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
        if (btn.dataset.section) {
          document.getElementById(btn.dataset.section + '-section').classList.add('active');
        }
      });
    });

    // Close Modal
    document.querySelector('.close').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
    });

    // Initial Render
    window.onload = () => {
      renderGallery('relics-gallery', relicsData);
      renderGallery('totems-gallery', totemsBestData);
    };

    // Upload (Supabase - Optional)
    async function uploadImage() {
      if (!isLoggedIn) return alert("Login first!");
      alert("Image upload feature ready (Supabase connect karna ho to bata)");
    }
  </script>
</body>
</html>
