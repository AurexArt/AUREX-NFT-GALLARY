<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREX | Relics & Totems</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      color:#fff;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:80px 20px 30px;
      position:relative;
    }

    h1{
      font-size:5rem;
      color:#ffaa00;
      letter-spacing:8px;
      font-family:Georgia, serif;
    }

    .header-buttons{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:12px;
    }

    button{
      padding:12px 24px;
      border-radius:50px;
      border:2px solid;
      background:transparent;
      cursor:pointer;
      font-weight:bold;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    #loginBtn{
      border-color:#ffd700;
      color:#ffd700;
    }

    #uploadBtn{
      border-color:#ffaa00;
      color:#ffaa00;
    }

    .nav{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:20px;
      background:#0a0a0a;
      flex-wrap:wrap;
    }

    .nav-btn{
      border-color:#ffbb33;
      color:#ffbb33;
    }

    .nav-btn.active{
      box-shadow:0 0 12px #ffbb33;
    }

    .section{
      display:none;
    }

    .section.active{
      display:block;
    }

    .legendary-banner{
      text-align:center;
      margin:25px 0;
      color:#ffcc66;
      font-size:1.5rem;
      font-weight:bold;
    }

    .gallery{
      width:100%;
      padding:15px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    @media(min-width:768px){
      .gallery{
        grid-template-columns:repeat(5,1fr);
      }
    }

    @media(min-width:1024px){
      .gallery{
        grid-template-columns:repeat(6,1fr);
      }
    }

    .nft-card{
      background:#111;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #444;
      position:relative;
    }

    .nft-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
      cursor:pointer;
    }

    /* DELETE BUTTON */
    .delete-btn{
      position:absolute;
      top:10px;
      right:10px;
      background:#ff3300;
      color:#fff;
      border:none;
      padding:8px 12px;
      border-radius:8px;
      font-size:12px;
      font-weight:bold;
      cursor:pointer;
      z-index:100;
    }

    .delete-btn:hover{
      background:#ff5500;
    }

    /* MODALS */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.95);
      z-index:9999;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    .modal-content{
      background:#111;
      width:100%;
      max-width:600px;
      padding:30px;
      border-radius:22px;
      border:2px solid #ff8800;
      position:relative;
    }

    .modal-content h2{
      text-align:center;
      color:#ffaa00;
      margin-bottom:20px;
    }

    input[type="file"],
    select{
      width:100%;
      padding:14px;
      background:#000;
      color:#fff;
      border:2px solid #444;
      border-radius:12px;
      margin-bottom:18px;
    }

    .modal-buttons{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .close{
      position:absolute;
      top:10px;
      right:20px;
      font-size:40px;
      color:#ffaa00;
      cursor:pointer;
    }

    #modalImage{
      width:100%;
      max-height:80vh;
      object-fit:contain;
      border-radius:12px;
    }

    .loader-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.95);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:999999;
    }

    .loader{
      width:80px;
      height:80px;
      border:7px solid #333;
      border-top:7px solid #ffaa00;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .loader-text{
      margin-top:20px;
      color:#ffaa00;
      font-size:1.4rem;
      font-weight:bold;
    }

    #progressText{
      margin-top:12px;
      color:#fff;
    }

  </style>
</head>
<body>

<header>
  <h1>AUREX</h1>

  <div class="header-buttons">
    <button id="loginBtn">LOGIN</button>
    <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn active" id="relicsBtn">RELICS</button>
  <button class="nav-btn" id="totemsBtn">TOTEMS</button>
</nav>

<section id="relics-section" class="section active">
  <div class="legendary-banner">ALL RELICS ARE LEGENDARY</div>
  <div class="gallery" id="relics-gallery"></div>
</section>

<section id="totems-section" class="section">
  <div style="text-align:center;padding:20px;">
    <button class="nav-btn active" id="bestBtn">BEST</button>
    <button class="nav-btn" id="legendaryBtn">LEGENDARY</button>
  </div>

  <div class="gallery" id="totems-gallery"></div>
</section>

<!-- UPLOAD MODAL -->
<div class="modal" id="uploadModal">
  <div class="modal-content">

    <span class="close" id="closeUpload">&times;</span>

    <h2>UPLOAD NFT</h2>

    <input type="file" id="imageUpload" multiple accept="image/*"/>

    <select id="nftSection">
      <option value="relics">Relics</option>
      <option value="totems">Totems</option>
    </select>

    <select id="totemType" style="display:none;">
      <option value="best">Best</option>
      <option value="legendary">Legendary</option>
    </select>

    <div class="modal-buttons">
      <button onclick="uploadNFTs()">UPLOAD</button>
      <button onclick="closeUploadModal()">CANCEL</button>
    </div>

  </div>
</div>

<!-- IMAGE PREVIEW -->
<div class="modal" id="previewModal">
  <div class="modal-content">

    <span class="close" id="closePreview">&times;</span>

    <img id="modalImage">

  </div>
</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader"></div>
  <div class="loader-text" id="loaderText">Uploading...</div>
  <div id="progressText">0/0</div>
</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let relicsData = [];
let totemsBestData = [];
let totemsLegendaryData = [];

let isLoggedIn = false;

async function loadNFTs(){

  const { data, error } = await supabaseClient
    .from("nfts_data")
    .select("*")
    .order("id", { ascending:false });

  if(error){
    console.log(error);
    return;
  }

  relicsData = [];
  totemsBestData = [];
  totemsLegendaryData = [];

  data.forEach(item => {

    const nft = {
      id:item.id,
      img:item.img,
      section:item.section,
      type:item.type
    };

    if(item.section === "relics"){
      relicsData.push(nft);
    }

    else if(item.section === "totems"){

      if(item.type === "best"){
        totemsBestData.push(nft);
      }

      else if(item.type === "legendary"){
        totemsLegendaryData.push(nft);
      }
    }

  });

  renderGallery("relics-gallery", relicsData);
  renderGallery("totems-gallery", totemsBestData);
}

function renderGallery(containerId, data){

  const container = document.getElementById(containerId);

  container.innerHTML = "";

  if(data.length === 0){

    container.innerHTML = `
      <h2 style="width:100%;text-align:center;padding:40px;">
        No NFTs Yet
      </h2>
    `;

    return;
  }

  data.forEach(item => {

    const card = document.createElement("div");

    card.className = "nft-card";

    card.innerHTML = `
      <img src="${item.img}" alt="NFT">
    `;

    // DELETE BUTTON
    if(isLoggedIn){

      const deleteBtn = document.createElement("button");

      deleteBtn.className = "delete-btn";

      deleteBtn.innerText = "DELETE";

      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        deleteNFT(item.id);
      };

      card.appendChild(deleteBtn);
    }

    card.querySelector("img").onclick = () => {

      document.getElementById("modalImage").src = item.img;

      document.getElementById("previewModal").style.display = "flex";
    };

    container.appendChild(card);

  });
}

async function uploadNFTs(){

  const files = document.getElementById("imageUpload").files;

  if(files.length === 0){
    alert("Select images");
    return;
  }

  const section = document.getElementById("nftSection").value;

  const totemType = document.getElementById("totemType").value;

  document.getElementById("loader").style.display = "flex";

  let uploaded = 0;

  for(let i=0; i<files.length; i++){

    const file = files[i];

    try{

      const fileName =
      `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split(".").pop()}`;

      const path = `${section}/${fileName}`;

      // STORAGE UPLOAD
      const { error: uploadError } = await supabaseClient
        .storage
        .from("nfts")
        .upload(path, file, {
          upsert:true
        });

      if(uploadError){
        console.log(uploadError);
        continue;
      }

      // PUBLIC URL
      const { data:urlData } = supabaseClient
        .storage
        .from("nfts")
        .getPublicUrl(path);

      // DATABASE SAVE
      const { error: dbError } = await supabaseClient
        .from("nfts_data")
        .insert([{
          img:urlData.publicUrl,
          section:section,
          type:section === "totems"
            ? totemType
            : null
        }]);

      if(dbError){
        console.log(dbError);
      }

      uploaded++;

      document.getElementById("progressText").innerText =
      `${uploaded}/${files.length}`;

    }catch(err){
      console.log(err);
    }
  }

  document.getElementById("loaderText").innerText =
  "Upload Complete";

  await loadNFTs();

  setTimeout(() => {

    document.getElementById("loader").style.display = "none";

    closeUploadModal();

  },1500);
}

async function deleteNFT(id){

  const confirmDelete = confirm("Delete NFT?");

  if(!confirmDelete) return;

  try{

    // GET IMAGE URL
    const { data:nft } = await supabaseClient
      .from("nfts_data")
      .select("img")
      .eq("id", id)
      .single();

    if(nft && nft.img){

      const imagePath =
      nft.img.split("/nfts/")[1];

      if(imagePath){

        await supabaseClient
          .storage
          .from("nfts")
          .remove([imagePath]);
      }
    }

    // DELETE DB ROW
    await supabaseClient
      .from("nfts_data")
      .delete()
      .eq("id", id);

    alert("NFT Deleted");

    loadNFTs();

  }catch(err){

    console.log(err);

    alert("Delete Failed");
  }
}

function closeUploadModal(){

  document.getElementById("uploadModal").style.display = "none";

  document.getElementById("imageUpload").value = "";
}

// LOGIN
document.getElementById("loginBtn")
.addEventListener("click", () => {

  if(isLoggedIn){

    isLoggedIn = false;

    document.getElementById("loginBtn").innerText =
    "LOGIN";

    document.getElementById("uploadBtn").style.display =
    "none";

    loadNFTs();

    return;
  }

  const secret = prompt("Enter Secret Word");

  if(secret === "tmkc" || secret === "Tmkc"){

    isLoggedIn = true;

    document.getElementById("loginBtn").innerText =
    "LOGOUT";

    document.getElementById("uploadBtn").style.display =
    "block";

    loadNFTs();

    alert("Login Successful");

  }else{
    alert("Wrong Secret");
  }
});

// OPEN UPLOAD MODAL
document.getElementById("uploadBtn")
.addEventListener("click", () => {

  document.getElementById("uploadModal").style.display =
  "flex";
});

// SECTION CHANGE
document.getElementById("nftSection")
.addEventListener("change", function(){

  document.getElementById("totemType").style.display =
  this.value === "totems"
    ? "block"
    : "none";
});

// CLOSE MODALS
document.getElementById("closePreview").onclick = () => {
  document.getElementById("previewModal").style.display =
  "none";
};

document.getElementById("closeUpload").onclick =
closeUploadModal;

// CLICK OUTSIDE MODAL
window.onclick = (e) => {

  if(e.target.id === "previewModal"){
    document.getElementById("previewModal").style.display =
    "none";
  }

  if(e.target.id === "uploadModal"){
    closeUploadModal();
  }
};

// NAVIGATION
document.getElementById("relicsBtn")
.addEventListener("click", () => {

  document.getElementById("relics-section")
  .classList.add("active");

  document.getElementById("totems-section")
  .classList.remove("active");

  renderGallery("relics-gallery", relicsData);
});

document.getElementById("totemsBtn")
.addEventListener("click", () => {

  document.getElementById("totems-section")
  .classList.add("active");

  document.getElementById("relics-section")
  .classList.remove("active");

  renderGallery("totems-gallery", totemsBestData);
});

document.getElementById("bestBtn")
.addEventListener("click", () => {

  renderGallery("totems-gallery", totemsBestData);
});

document.getElementById("legendaryBtn")
.addEventListener("click", () => {

  renderGallery("totems-gallery", totemsLegendaryData);
});

loadNFTs();

</script>

</body>
</html>
